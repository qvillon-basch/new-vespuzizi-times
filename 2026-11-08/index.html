<script type="application/json" id="nvt-data">{"pages":["\u003cdiv class='inner une'>\u003cdiv class=\"une-top\">\u003cdiv class=\"ear\">Le seul quotidien\u003cbr>lu à la barre\u003c/div>\u003cdiv class=\"thenew\" data-fitw=\"\">The New\u003c/div>\u003cdiv class=\"seal\">\u003cb>n°\u003c/b>\u003cspan>8\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"mast\" data-fitw=\"\" style=\"font-size: 5.9rem;\">Vespuzizi Times\u003c/div>\u003chr class=\"rule\">\u003chr class=\"rule2\">\u003cdiv class=\"date\" style=\"margin-bottom: calc(6.08516rem);\">\u003cspan>dimanche 8 novembre 2026\u003c/span>\u003cspan>Route du Rhum, jour 8\u003c/span>\u003c/div>\u003cfigure class=\"une-fig\" style=\"margin-bottom: calc(5.98516rem);\">\u003cdiv class=\"frame\">\u003cimg class=\"zoom\" src=\"img/dessin.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin du jour\">\u003c/div>\u003cfigcaption>Le dessin du jour\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo fait le cours au tableau, craie dans une main et rhum dans l'autre&nbsp;; Magegland boude sur sa pile de copies, Jean Le Camembert lève la bouteille, Christof rame en grognant et Vasco salue depuis l'horizon&nbsp;: la leçon est donnée.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>1\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003ch2 class=\"headline\">Cours de maths sur le ponton : le jeu a rendu sa copie\u003c/h2>\u003cp class=\"lead\">Jour 8. 2 890 milles au compteur, 1 146e au relevé de 17 h 42. Amerigo a sorti la craie. Deux règles, deux classements&nbsp;: le jeu compte le long du tracé, le Times compte la mer. Dans les deux, un seul nom en haut du tableau. La rédaction d'en face a boudé tout le cours. Elle n'a pas compris la leçon. Elle a compris la note. Figure de proue&nbsp;: encore 215 places sur le 918e d'Isa Autissier-de-Poche, le 2 novembre.\u003c/p>\u003ch2>La flotte\u003c/h2>\u003cp>Au pointage de 17 h 34, Amerigo mène de 43,6 milles. Même leader sous les deux calculs, depuis jeudi.\u003c/p>\u003cp>En tête. Jean Le Camembert (3 243e) talonne, 2e. À portée de voix ce matin, à portée de jumelles ce soir. Le camembert avait besoin d'air.\u003c/p>\u003cp class=\"split\">Le podium. Loïc Peyronladdition (5 228e) pointe 3e, à 64,8 milles. Dauphin dans le jeu ce matin&nbsp;; le dauphin a pris l'eau. Magegland (6 206e), 4e à 73,5 milles, lui fait coucou depuis 7 h, Forrest Gump à l'appui. Forrest court\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>2\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full mapinner'>\u003ch2>Le Film des 24 h\u003c/h2>\u003cdiv class=\"sub\">Les routes des copains, de samedi 18 h à dimanche 18 h\u003c/div>\u003cdiv class=\"mapbox\">\u003csvg class=\"map\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carte animée des trajectoires des copains\">\u003c/svg>\u003c/div>\u003cdiv class=\"mapbar\">\u003cspan id=\"clock\">\u003c/span>\u003cbutton class=\"replay\" type=\"button\">↻ Rejouer\u003c/button>\u003c/div>\u003cdiv class=\"mapnote\">Un point par bateau, \u003ci>Amerigo\u003c/i> en rouge sang de bœuf.\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>3\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">bien. Il ne rattrape personne.\u003c/p>\u003cp>Le peloton. Christof Cancer du Colon (17 043e) décroche, 5e à 140,8 milles. Les crocs d'hier sont si loin qu'on n'entend plus aboyer. Maud Fontenoyade (22 398e), 6e, aligne 470 milles dans la journée, plus que le leader. Olivier de Kersaucisson (33 628e), 7e à 214,9 milles, zéro message&nbsp;: le Brestois sèche même sa remontée.\u003c/p>\u003cp>La cale. Ananas Tabarly (78 227e) double Kéké Gabart (78 443e) à 13 h 13, 301 milles contre 260&nbsp;: la piña colada passe devant la motricité fine, sans trembler. Lanterne rouge, Vasco de Gamelle (91 025e), à l'arrêt à 12 h 12, reparti à 12 h 33. Le temps d'un pastel de nata.\u003c/p>\u003cp>Demain&nbsp;? Le tracé est replacé. La flotte va découvrir qu'il passe derrière Amerigo.\u003c/p>\u003ca class=\"encart relire\" href=\"https://qvillon-basch.github.io/new-vespuzizi-times/2026-11-07/\">\u003cspan class=\"t\">À relire\u003c/span>\u003cspan class=\"d\">Le numéro du samedi 7 novembre 2026\u003c/span>\u003cspan class=\"h\">Soixante heures de laisse&nbsp;: hier la chaîne, ce soir la craie.\u003c/span>\u003c/a>\u003ch2>L'église au centre du village\u003c/h2>\u003cp class=\"split\">10 h 42. Amerigo vire de bord, cap au sud. «&nbsp;On replace l'église au centre du village&nbsp;»,\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>4\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">lance-t-il à Magegland, qui réclamait le tracé. Une heure plus tard, plus de 1 500 places reprises au général. Le jeu reconnaît ses torts. Il prévenait pourtant&nbsp;: «&nbsp;ça va être de ma faute si ton classement tire tout droit à travers la montagne&nbsp;!&nbsp;». Non. C'est de sa faute si Amerigo a dû tourner la barre pour lui faire plaisir. L'église est au centre. Le curé reste en tête du cortège.\u003c/p>\u003ch2>Le boost du fromager\u003c/h2>\u003cp>5,1 nœuds à 11 h 32. Jean Le Camembert avance ce matin comme un camembert qui coule. Sa défense&nbsp;: «&nbsp;attention le boost est bientôt rechargé&nbsp;». On lui a rappelé que le DRS, c'est en Formule 1. Amerigo complète&nbsp;: il ne s'ouvre qu'à moins d'une seconde de la voiture de devant. Le fromager n'a pas de voiture devant lui. Il a l'horizon. Qu'il branche son boost. Amerigo, lui, est branché sur la 1re place.\u003c/p>\u003ch2>507 milles pour rester 5e\u003c/h2>\u003cp class=\"split\">Christof Cancer du Colon a abattu 507 milles, 20,9 nœuds de moyenne. Record de la flotte. Résultat&nbsp;: cinquième. Le plus gros kilométrage du jour pour admirer quatre poupes. Hier soir,\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>5\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">cap au nord-ouest&nbsp;: Amerigo attendait un rival, il reçoit un touriste. À sa «&nbsp;course plus que décevante&nbsp;», le vainqueur du Vendée Globe répond&nbsp;: «&nbsp;C'est pas la chute l'important, c'est l'atterrissage 🫠&nbsp;». Amerigo a revu La Haine. L'atterrissage, on ne le voit jamais. Lui non plus.\u003c/p>\u003ch2>Vasco plaide la triche\u003c/h2>\u003cp>«&nbsp;J'appelle ça de la triche.&nbsp;» Vasco de Gamelle, 11e à 716 milles, a trouvé la cause de son classement&nbsp;: les autres. Il pensait «&nbsp;qu'on était des vrais navigateurs ici&nbsp;». Le Times a relu le règlement épinglé&nbsp;: pas d'option payante, catégorie IMOCA, une bouteille de rhum au vainqueur. Aucun article n'interdit d'être devant lui. Dix bateaux ont vérifié. L'honneur du Portugais est sauf. Son classement, lui, chasse l'araignée sans masque, avec des palmes d'enfant.\u003c/p>\u003ch2>Compliments denrée rare\u003c/h2>\u003cp class=\"split\">Deux dans le même numéro. Maud Fontenoyade, 24,1 nœuds à 8 h 10, la plus rapide de toute la flotte, 132 milles repris dans la nuit. Amerigo le lui a dit à table, il le répète ici&nbsp;: la plus belle remontée de la course, à l'instinct,\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>6\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">comme les grandes. Isa Autissier-de-Poche a franchi une ligne d'arrivée ce matin. Amerigo la félicite chaleureusement, et compte bien l'imiter mercredi. Ses compliments sont rares&nbsp;: celui-là est mérité. Les huit autres&nbsp;? Qu'ils remontent d'abord. Le stock se refait au mérite.\u003c/p>\u003ch2>Le journal de bord du capitaine\u003c/h2>\u003cp>Amerigo a tourné la barre à midi, à pleines mains, les embruns dans la gueule. Un virement, le dernier. Depuis, le foil chante et le bateau gîte du bon côté&nbsp;: le sien. Derrière, ça compte, ça recompte, ça colorie des graphiques. Lui n'a qu'une règle. «&nbsp;Le seul juge, c'est la ligne d'arrivée&nbsp;», dit-il, et Pointe-à-Pitre est devant. Le rhum&nbsp;? Entamé. La bouteille du vainqueur&nbsp;? Fermée, par politesse pour les dix qui la paieront. Dormir&nbsp;? Plus tard. On ne dort pas quand on tient la roue d'une course que les autres regardent de loin.\u003c/p>\u003cblockquote class=\"pull\" style=\"margin-top: calc(5.05rem);\">\u003cspan>Au pointage de 17 h 34, Amerigo mène de 43,6 milles.\u003c/span>\u003c/blockquote>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>7\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full photoinner'>\u003ch2>À bord avec Amerigo\u003c/h2>\u003cfigure class=\"fig endfig\">\u003cimg class=\"zoom\" src=\"img/bord.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin de bord\" data-fit=\"240\" data-fitmin=\"140\" style=\"--h: 24rem;\">\u003cfigcaption>Le dessin de bord\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo salue le cortège d'une main et tient la roue de l'autre&nbsp;: derrière, Jean Le Camembert brandit déjà sa bouteille, Maud, Christof et Magegland suivent dans l'écume. Le curé mène, le village arrose.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>8\u003c/b>\u003cspan>8 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full rankinner'>\u003cdiv class=\"banc\" style=\"--rowpad: 0.34rem;\">\u003cdiv class=\"title\" data-fitw=\"\">Le Banc des Moussaillons\u003c/div>\u003cdiv class=\"when\">Classement des copains, dimanche 8 novembre 2026, classement du jeu à 17 h 34 · Amerigo au général : 1 146e au relevé de 17 h 42\u003c/div>\u003ctable>\u003cthead>\u003ctr class=\"grp\">\u003cth colspan=\"4\">\u003c/th>\u003cth colspan=\"2\" class=\"g24\">Dernières 24 h\u003c/th>\u003c/tr>\u003ctr>\u003cth>\u003c/th>\u003cth class=\"nm\">Moussaillon\u003c/th>\u003cth>Au gén.\u003c/th>\u003cth>Écart\u003csmall>milles\u003c/small>\u003c/th>\u003cth class=\"s24\">Milles\u003c/th>\u003cth>Vit. moy.\u003csmall>nœuds\u003c/small>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"me\">\u003ctd class=\"r\">1\u003c/td>\u003ctd class=\"nm long\">\u003cb>Amerigo Vespuzizi\u003c/b>\u003c/td>\u003ctd class=\"g\">1 146\u003csup>e\u003c/sup>\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"s24\">440\u003c/td>\u003ctd>18,2\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">2\u003c/td>\u003ctd class=\"nm long\">\u003cb>Jean Le Camembert\u003c/b>\u003c/td>\u003ctd class=\"g\">3 243\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+43,6\u003c/td>\u003ctd class=\"s24\">435\u003c/td>\u003ctd>17,9\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">3\u003c/td>\u003ctd class=\"nm long\">\u003cb>Loïc Peyronladdition\u003c/b>\u003c/td>\u003ctd class=\"g\">5 228\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+64,8\u003c/td>\u003ctd class=\"s24\">434\u003c/td>\u003ctd>17,9\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">4\u003c/td>\u003ctd class=\"nm\">\u003cb>Magegland\u003c/b>\u003c/td>\u003ctd class=\"g\">6 206\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+73,5\u003c/td>\u003ctd class=\"s24\">472\u003c/td>\u003ctd>19,5\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">5\u003c/td>\u003ctd class=\"nm long\">\u003cb>Christof Cancer du Colon\u003c/b>\u003cspan class=\"tag\">meilleur 24 h\u003c/span>\u003c/td>\u003ctd class=\"g\">17 043\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+140,8\u003c/td>\u003ctd class=\"s24\">507\u003c/td>\u003ctd>20,9\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">6\u003c/td>\u003ctd class=\"nm\">\u003cb>Maud Fontenoyade\u003c/b>\u003c/td>\u003ctd class=\"g\">22 398\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+163,4\u003c/td>\u003ctd class=\"s24\">47
