<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>The New Vespuzizi Times — les rubriques du soir</title>
<!-- Page de service générique : aucun contenu du jour ici. Le contenu voyage dans le fragment
     du lien (#…, jamais transmis au serveur) : JSON UTF-8 → DEFLATE brut → base64url sans « = ».
     Polices : NVT Gothique (Pirata One) et NVT Serif (STIX General), SIL Open Font License 1.1. -->
<style>
@font-face{font-family:'NVT Gothique';src:url('assets/fonts/nvt-gothique.woff') format('woff');font-display:swap}
@font-face{font-family:'NVT Serif';src:url('assets/fonts/nvt-serif-400.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'NVT Serif';src:url('assets/fonts/nvt-serif-400i.woff') format('woff');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:'NVT Serif';src:url('assets/fonts/nvt-serif-700.woff') format('woff');font-weight:700;font-style:normal;font-display:swap}
:root{--parch:#E6D2A8;--ink:#2B1D10;--blood:#7B1F14;--sepia:#7E5F3A}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 30%,#5a3d22 0%,#3a2716 60%,#24170c 100%);
  font:18px/1.4 'NVT Serif',Georgia,'Times New Roman',serif;color:var(--ink);padding:14px 10px 40px}
.sheet{max-width:560px;margin:0 auto;padding:18px 18px 24px;border-radius:4px;
  background:radial-gradient(ellipse at 20% 10%,rgba(255,245,215,.55),transparent 55%),var(--parch);
  box-shadow:inset 0 0 30px rgba(90,50,15,.45),0 6px 24px rgba(0,0,0,.5)}
.mast{font-family:'NVT Gothique',Georgia,serif;text-align:center;line-height:1.02;font-size:30px}
.mast b{display:block;font-weight:400;font-size:44px}
hr{border:0;border-top:3px solid var(--ink);margin:10px 0 2px} hr+hr{border-top-width:1px;margin:0 0 8px}
h1{font-family:'NVT Gothique',Georgia,serif;font-weight:400;font-size:30px;line-height:1.1;margin:10px 0 2px}
.when{font-style:italic;color:var(--sepia);margin-bottom:12px}
h2{font-family:'NVT Gothique',Georgia,serif;font-weight:400;font-size:24px;margin:18px 0 6px;border-bottom:1.5px solid rgba(43,29,16,.35)}
.imposed li{list-style:none;padding:6px 0 6px 28px;position:relative;font-style:italic}
.imposed li::before{content:"✦";position:absolute;left:4px;color:var(--blood);font-style:normal}
label.prop{display:flex;gap:12px;align-items:flex-start;padding:12px 6px;border-bottom:1px dotted rgba(43,29,16,.45);cursor:pointer}
label.prop input{flex:none;width:26px;height:26px;margin-top:2px;accent-color:var(--blood)}
label.prop b{display:block;font-size:19px}
label.prop span{display:block;font-style:italic;color:#4a3420;font-size:17px}
.own label{display:block;font-weight:700;margin:10px 0 4px}
.own input,.own textarea{width:100%;font:inherit;font-size:17px;padding:10px;border:1px solid rgba(43,29,16,.5);border-radius:4px;background:#fbf6ea;color:var(--ink)}
.own textarea{min-height:96px;resize:vertical}
.hint{font-size:15px;font-style:italic;color:var(--sepia);margin-top:4px}
button{display:block;width:100%;margin-top:22px;min-height:52px;font:inherit;font-size:21px;font-weight:700;
  background:var(--blood);color:#f6e7c8;border:0;border-radius:8px;cursor:pointer}
button[disabled]{opacity:.5}
.msg{margin-top:16px;padding:12px 14px;border-radius:6px;font-size:17px}
.msg.ok{background:rgba(46,107,102,.15);border:1px solid #2E6B66}
.msg.err{background:rgba(123,31,20,.12);border:1px solid var(--blood)}
.msg b{display:block}
[hidden]{display:none!important}
</style></head>
<body><main class="sheet">
<div class="mast">The New<b>Vespuzizi Times</b></div><hr><hr>
<h1>Les rubriques du soir</h1>
<div class="when" id="when"></div>
<div id="msg" class="msg" role="status" aria-live="polite" hidden></div>
<form id="form" hidden>
<h2>Au sommaire d'office</h2>
<ul class="imposed" id="imposed"></ul>
<h2>Les propositions</h2>
<div id="props"></div>
<div class="hint">Aucune case cochée&nbsp;: seules les rubriques d'office.</div>
<h2>Ma rubrique</h2>
<div class="own">
<label for="ownTitle">Titre</label><input id="ownTitle" type="text" maxlength="60" autocomplete="off">
<label for="ownText">Consigne</label><textarea id="ownText" maxlength="600"></textarea>
<div class="hint">Facultatif&nbsp;: laisse vide si tu n'as pas d'idée ce soir.</div>
</div>
<button id="go" type="submit">Rédiger</button>
</form>
</main>
<script>
(function () {
  'use strict';
  var MAX_PROPOSALS = 6; // = inbox.MAX_PROPOSALS (vérifié par les tests)
  var PLAN_B ='Plan B : coche les rubriques dans rubriques.md sur le PC puis appuie sur Rédiger dans la notification.';
  var JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var $ = function (id) { return document.getElementById(id); };
  var data = null;

  function message(kind, title, text) {
    var m = $('msg');
    m.className = 'msg ' + kind;
    m.textContent = '';
    var b = document.createElement('b'); b.textContent = title; m.appendChild(b);
    if (text) { var s = document.createElement('span'); s.textContent = text; m.appendChild(s); }
    m.hidden = false;
  }
  function dateFr(iso) {
    var p = iso.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1, p[2]));
    return JOURS[d.getUTCDay()] + ' ' + p[2] + ' ' + MOIS[p[1] - 1] + ' ' + p[0];
  }
  function decode(frag) { // base64url → DEFLATE brut → JSON UTF-8
    var s = frag.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s), u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    var stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Response(stream).text().then(JSON.parse);
  }
  function valid(d) {
    if (!d || d.v !== 1 || typeof d.edition !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(d.edition)) return false;
    if (typeof d.nonce !== 'string' || !/^[A-Za-z0-9_-]{4,40}$/.test(d.nonce)) return false;
    if (typeof d.reply !== 'string' || !/^[A-Za-z0-9_-]{1,64}$/.test(d.reply)) return false;
    if (!Array.isArray(d.proposals) || d.proposals.length > MAX_PROPOSALS) return false;
    var seen = {};
    return d.proposals.every(function (p) { // n : entier de 1 à MAX_PROPOSALS, unique
      if (!p || typeof p.title !== 'string' || !Number.isInteger(p.n) || p.n < 1 || p.n > MAX_PROPOSALS || seen[p.n]) return false;
      seen[p.n] = true;
      return true;
    });
  }
  function canInflate() { // DecompressionStream('deflate-raw') absent ou refusé : navigateur trop ancien
    try { new DecompressionStream('deflate-raw'); return true; } catch (e) { return false; }
  }
  function render(d) {
    $('when').textContent = 'Numéro du ' + dateFr(d.edition);
    var imp = Array.isArray(d.imposed) && d.imposed.length ? d.imposed : ['La Flotte', 'Le Journal de bord du capitaine'];
    imp.forEach(function (t) { var li = document.createElement('li'); li.textContent = String(t); $('imposed').appendChild(li); });
    d.proposals.forEach(function (p) {
      var n = p.n;
      var l = document.createElement('label'); l.className = 'prop';
      var c = document.createElement('input'); c.type = 'checkbox'; c.value = String(n); c.name = 'r';
      var t = document.createElement('div');
      var b = document.createElement('b'); b.textContent = n + '. ' + p.title; t.appendChild(b);
      if (p.hook) { var h = document.createElement('span'); h.textContent = String(p.hook); t.appendChild(h); }
      l.appendChild(c); l.appendChild(t); $('props').appendChild(l);
    });
    $('form').hidden = false;
  }
  // REDIGER <nonce> <numéros> | <titre>\n<consigne> : après le « | » (toujours présent), le titre
  // sur la première ligne, la consigne sur les suivantes (`editor.parse_own`). Titre vide : une
  // première ligne vide puis la consigne (« \n<consigne> » : titre au choix du rédacteur).
  function body() {
    var nums = Array.prototype.map.call(document.querySelectorAll('#props input:checked'), function (c) { return c.value; });
    var title = $('ownTitle').value.replace(/\s+/g, ' ').trim();
    var text = $('ownText').value.replace(/\r\n?/g, '\n').trim();
    var own = title ? (text ? title + '\n' + text : title) : (text ? '\n' + text : '');
    return 'REDIGER ' + data.nonce + (nums.length ? ' ' + nums.join(' ') : '') + ' | ' + own;
  }
  function lock(on) {
    Array.prototype.forEach.call(document.querySelectorAll('#form input, #form textarea, #go'), function (e) { e.disabled = on; });
  }
  function send(ev) {
    ev.preventDefault();
    if (!data) return;
    var payload = body();
    lock(true);
    $('go').textContent = 'Envoi…';
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 15000);
    // texte brut, sans en-tête : requête « simple », pas de requête préalable CORS
    fetch('https://ntfy.sh/' + data.reply, { method: 'POST', body: payload, signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        $('go').textContent = 'Envoyé';
        message('ok', 'Choix envoyé.', 'Amerigo prend la plume : le brouillon arrivera dans une notification.');
      })
      .catch(function (e) {
        clearTimeout(timer);
        lock(false);
        $('go').textContent = 'Rédiger';
        var why = e && e.name === 'AbortError' ? 'pas de réponse au bout de 15 s' : 'envoi impossible';
        message('err', 'Le choix n\'est pas parti (' + why + ').', 'Réessaie dans un instant. ' + PLAN_B);
      });
  }
  $('form').addEventListener('submit', send);
  var frag = location.hash.replace(/^#/, '');
  if (!frag) { message('err', 'Lien incomplet : aucune proposition dans ce lien.', 'Rouvre la notification du soir. ' + PLAN_B); return; }
  if (!canInflate()) { message('err', 'Navigateur trop ancien pour lire ce lien.', PLAN_B); window.__choix = { ready: false }; return; }
  var ok = function (d) { if (!valid(d)) throw new Error('format'); data = d; render(d); window.__choix = { ready: true }; };
  try {
    decode(frag).then(ok).catch(function () { message('err', 'Lien abîmé ou incomplet : propositions illisibles.', 'Rouvre la notification du soir. ' + PLAN_B); window.__choix = { ready: false }; });
  } catch (e) {
    message('err', 'Lien abîmé ou incomplet : propositions illisibles.', 'Rouvre la notification du soir. ' + PLAN_B);
    window.__choix = { ready: false };
  }
})();
</script>
</body></html>
