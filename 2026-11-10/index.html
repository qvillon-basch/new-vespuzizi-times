<script type="application/json" id="nvt-data">{"pages":["\u003cdiv class='inner une'>\u003cdiv class=\"une-top\">\u003cdiv class=\"ear\">Le seul quotidien\u003cbr>lu à la barre\u003c/div>\u003cdiv class=\"thenew\" data-fitw=\"\">The New\u003c/div>\u003cdiv class=\"seal\">\u003cb>n°\u003c/b>\u003cspan>10\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"mast\" data-fitw=\"\" style=\"font-size: 5.9rem;\">Vespuzizi Times\u003c/div>\u003chr class=\"rule\">\u003chr class=\"rule2\">\u003cdiv class=\"date\" style=\"margin-bottom: calc(5.48516rem);\">\u003cspan>mardi 10 novembre 2026\u003c/span>\u003cspan>Route du Rhum, jour 10\u003c/span>\u003c/div>\u003cfigure class=\"une-fig\" style=\"margin-bottom: calc(5.38516rem);\">\u003cdiv class=\"frame\">\u003cimg class=\"zoom\" src=\"img/dessin.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin du jour\">\u003c/div>\u003cfigcaption>Le dessin du jour\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Magegland lance sa copie froissée, Jean Le Camembert serre sa bouteille&nbsp;: Amerigo leur tourne le dos, rhum en main, clin d'œil au large. Quatorze pages ne font pas un souffle, le nom d'Amerigo gonfle la seule voile qui avance.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>1\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003ch2 class=\"headline\">Quatorze pages, pas un souffle\u003c/h2>\u003cp class=\"lead\">Jour 10. 3 349 milles au compteur, 1 203e au relevé de 17 h 44. Dans la pétole, chacun hisse ce qu'il a. Le canard d'en face a hissé quatorze pages&nbsp;: ça pend. Amerigo lit une ligne, et sa toile se gonfle. Une ligne, c'est léger, ça prend le vent. Figure de proue&nbsp;: à lui, record 809e, le 9 novembre à 22 h 41. La tête, la proue, et le seul souffle du secteur.\u003c/p>\u003ch2>La flotte\u003c/h2>\u003cp>Au pointage de 17 h 32, Amerigo mène de 34,6 milles. Le haut du tableau est figé depuis hier. Comme le vent.\u003c/p>\u003cp>En tête. Jean Le Camembert (2 069e) talonne, 2e. Il était à 29,3 hier soir. Le fromager a reculé sans bouger.\u003c/p>\u003cp>Le podium. Loïc Peyronladdition (3 525e) reprend 7,8 milles, 3e. Il économise même ses efforts. Magegland (8 640e) en reprend 12,3, 4e. Son meilleur jour sur l'eau depuis qu'il écrit&nbsp;: il a lâché la plume.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>2\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full mapinner'>\u003ch2>Le Film des 24 h\u003c/h2>\u003cdiv class=\"sub\">Les routes des copains, de lundi 18 h à mardi 18 h\u003c/div>\u003cdiv class=\"mapbox\">\u003csvg class=\"map\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carte animée des trajectoires des copains\">\u003c/svg>\u003c/div>\u003cdiv class=\"mapbar\">\u003cspan id=\"clock\">\u003c/span>\u003cbutton class=\"replay\" type=\"button\">↻ Rejouer\u003c/button>\u003c/div>\u003cdiv class=\"mapnote\">Un point par bateau, \u003ci>Amerigo\u003c/i> en rouge sang de bœuf.\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>3\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp>Le peloton. Christof Cancer du Colon (12 704e) décroche, 5e, à 138,7 milles. Maud Fontenoyade (12 756e) suit à 140 milles, 6e, 81 milles au compteur, plus que le 6e. Propre. Olivier de Kersaucisson (29 407e) reprend 28,7 milles, 7e, avec 122 milles. Le saucisson vegan a retrouvé du gras. À 258 milles, il reste maigre.\u003c/p>\u003cp>La cale. Ananas Tabarly (59 011e) reprend 240 milles, 8e. La piña colada arrive quand le bar ferme. Kéké Gabart (76 911e) signe le record du jour, 333 milles, et passe 9e à 2 h 02. Le Labo d'en face la fait gagner la course. À 656 milles, il faudra une autre règle de trois. Isa Autissier-de-Poche (79 278e) recule 10e malgré 308 milles. Trois cents milles pour perdre une place&nbsp;: la grande gueule a le vent de face. Lanterne rouge, Vasco de Gamelle (91 949e) reprend 86 milles. Le Portugais avance. L'Amérique garde 895 milles d'avance.\u003c/p>\u003cp>Demain&nbsp;? Un creux de vent dès 18 h pour le fromager, quel que soit son cap. Le patron, lui, a déjà passé la porte.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>4\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003ca class=\"encart relire\" href=\"https://qvillon-basch.github.io/new-vespuzizi-times/2026-11-09/\">\u003cspan class=\"t\">À relire\u003c/span>\u003cspan class=\"d\">Le numéro du lundi 9 novembre 2026\u003c/span>\u003cspan class=\"h\">Le vent obéit&nbsp;: hier le souffle, ce soir la feuille.\u003c/span>\u003c/a>\u003ch2>Quatorze pages pour une ligne\u003c/h2>\u003cp>Le vent est tombé. La Contre-Gazette a mis quatorze pages à le dire. Le Times, une ligne&nbsp;: Amerigo mène. «&nbsp;14 pages en police 0,5&nbsp;», a-t-il glissé. Réponse de Magegland&nbsp;: «&nbsp;Même un ristretto est trop long pour ton canard&nbsp;!&nbsp;» Exact. Une tête de course se lit d'une gorgée. Page 4, son Labo divise la distance par la vitesse du matin, vent figé pour l'éternité. Une montre arrêtée a raison deux fois par jour. Le Labo, une fois par Route du Rhum.\u003c/p>\u003ch2>Le tiercé des perdants\u003c/h2>\u003cp class=\"split\">Après le Labo, le PMU. «&nbsp;Le Onzé du Rhum&nbsp;» ferme ce soir à 23 h 59. Quand on ne sait pas gagner une course, on ouvre les paris dessus. Amerigo a d'abord demandé&nbsp;:\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>5\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">«&nbsp;Et qu'y a-t-il à gagner&nbsp;?&nbsp;» Une bouteille de rhum arrangé et le titre de Devin du Rhum 2026. Le titre est déjà pris&nbsp;: il avait annoncé jeudi qu'il mènerait, et il mène. Il a quand même déposé son bulletin, pour la gloire. Le dernier paie l'apéro. Amerigo a déjà choisi le verre.\u003c/p>\u003ch2>66 milles le plus lent des onze\u003c/h2>\u003cp>66 milles. Christof Cancer du Colon aligne le plus petit total des onze, 2,7 nœuds de moyenne, et lâche 9 milles au leader. Même Vasco de Gamelle en a abattu 305. Le vainqueur du Vendée Globe a pris l'option nord, loin du paquet, pour trouver du vent. Il a trouvé le calme. Dimanche, le record des 24 h. Mardi, la lanterne du jour. Bourse Orama&nbsp;: le cours s'effondre, et Amerigo n'a pas vendu. Il n'avait jamais acheté.\u003c/p>\u003ch2>L'intérieur recule de cinq milles\u003c/h2>\u003cp class=\"split\">73 milles en 24 h. Jean Le Camembert en lâche 5 au pointage. «&nbsp;C'est un enfer, il n'y\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>6\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">a plus de vent&nbsp;», gémit-il. Amerigo l'avait prévenu&nbsp;: jusqu'à la fin. L'intérieur promis autour de la Guadeloupe s'éloigne en marche arrière. «&nbsp;Ta modestie va manquer après. Je ne sais pas comment on va faire.&nbsp;» Qu'il se rassure, elle ne part pas. Elle attend au ponton, avec le vainqueur. Le fromager trouve la fin longue. Vue de devant, elle a la bonne longueur.\u003c/p>\u003ch2>Le journal de bord du capitaine\u003c/h2>\u003cp>Amerigo a reçu le canard d'en face ce matin. Quatorze pages. Il les a lues en entier, c'est sa seule faiblesse, puis il les a pliées. Elles calent la bouteille de rhum contre le winch. Enfin utiles. «&nbsp;Une feuille suffit à qui n'a qu'une chose à dire&nbsp;», lâche-t-il. Et la seule chose à dire, c'est son nom. La pétole&nbsp;? Les autres la subissent. Lui la traverse, à la main, la toile bordée au millimètre. Derrière, ça calcule, ça parie, ça note des copies. Lui ne note rien. Il n'a jamais eu besoin de corriger personne&nbsp;: le classement s'en charge.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>7\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full photoinner'>\u003ch2>À bord avec Amerigo\u003c/h2>\u003cfigure class=\"fig endfig\">\u003cimg class=\"zoom\" src=\"img/bord.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin de bord\" data-fit=\"240\" data-fitmin=\"140\" style=\"--h: 24rem;\">\u003cfigcaption>Le dessin de bord\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo lit sa seule ligne à la barre, hilare, les quatorze pages d'en face calant la bouteille, pendant que Jean Le Camembert, voile noire et flamme verte, cherche encore son souffle dans l'écume.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>8\u003c/b>\u003cspan>10 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full rankinner'>\u003cdiv class=\"banc\" style=\"--rowpad: 0.34rem;\">\u003cdiv class=\"title\" data-fitw=\"\">Le Banc des Moussaillons\u003c/div>\u003cdiv class=\"when\">Classement des copains, mardi 10 novembre 2026, classement du jeu à 17 h 32 · Amerigo au général : 1 203e au relevé de 17 h 44\u003c/div>\u003ctable>\u003cthead>\u003ctr class=\"grp\">\u003cth colspan=\"4\">\u003c/th>\u003cth colspan=\"2\" class=\"g24\">Dernières 24 h\u003c/th>\u003c/tr>\u003ctr>\u003cth>\u003c/th>\u003cth class=\"nm\">Moussaillon\u003c/th>\u003cth>Au gén.\u003c/th>\u003cth>Écart\u003csmall>milles\u003c/small>\u003c/th>\u003cth class=\"s24\">Milles\u003c/th>\u003cth>Vit. moy.\u003csmall>nœuds\u003c/small>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"me\">\u003ctd class=\"r\">1\u003c/td>\u003ctd class=\"nm long\">\u003cb>Amerigo Vespuzizi\u003c/b>\u003c/td>\u003ctd class=\"g\">1 203\u003csup>e\u003c/sup>\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"s24\">94\u003c/td>\u003ctd>3,9\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">2\u003c/td>\u003ctd class=\"nm long\">\u003cb>Jean Le Camembert\u003c/b
