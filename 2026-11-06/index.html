<script type="application/json" id="nvt-data">{"pages":["\u003cdiv class='inner une'>\u003cdiv class=\"une-top\">\u003cdiv class=\"ear\">Le seul quotidien\u003cbr>lu à la barre\u003c/div>\u003cdiv class=\"thenew\" data-fitw=\"\">The New\u003c/div>\u003cdiv class=\"seal\">\u003cb>n°\u003c/b>\u003cspan>6\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"mast\" data-fitw=\"\" style=\"font-size: 5.9rem;\">Vespuzizi Times\u003c/div>\u003chr class=\"rule\">\u003chr class=\"rule2\">\u003cdiv class=\"date\">\u003cspan>vendredi 6 novembre 2026\u003c/span>\u003cspan>Route du Rhum, jour 6\u003c/span>\u003c/div>\u003cfigure class=\"une-fig\">\u003cdiv class=\"frame\">\u003cimg class=\"zoom\" src=\"img/dessin.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin du jour\">\u003c/div>\u003cfigcaption>Le dessin du jour\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo, gants de boxe aux poings, seul sur un ring posé au milieu de l'Atlantique&nbsp;; autour, six téléphones flottent avec «&nbsp;vu&nbsp;» à l'écran, et un petit bateau portugais tend un carton «&nbsp;lundi&nbsp;».\u003c/p>\u003ch2 class=\"headline\">Amerigo attend du Monde\u003c/h2>\u003cp class=\"lead split\">Jour 6&nbsp;: 2 073 milles dans le sillage, 1 442e sur plus de 90 000 bateaux, et quarante heures en tête des copains sans qu'un seul\u003c/p>\u003cdiv class=\"suite\">Suite page 2 ▸\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>1\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cdiv class=\"kicker\">Suite de la Une\u003c/div>\u003cp class=\"cont\">ait eu le courage de venir lui respirer dans le cou. Amerigo a tout fait pour rendre la course intéressante&nbsp;: il a laissé le vent se reposer et ouvert un ring à 13 h 51 pour qui voulait se friter. Rien. La flotte lit, la flotte voit, la flotte se tait. On ne monte pas sur un ring quand l'adversaire est déjà sur le podium. La Route du Rhum 2026 a un patron, et les dix autres ont vue sur sa poupe, avec des jumelles, par temps clair.\u003c/p>\u003ch2>La flotte\u003c/h2>\u003cp>Plus grosse remontée de la nuit, Olivier de Kersaucisson&nbsp;: trois bateaux doublés, 7e, 51 956e&nbsp;; le Brestois double les gens pendant qu'ils dorment, lui qui n'était pas réveillé au départ. Loïc Peyronladdition, 4e, est parti sauver des bateaux qui se retournent, et Amerigo le salue sincèrement&nbsp;: il repêche tout le monde sauf son classement, 506 milles sans gagner une place. Maud Fontenoyade, 5e, a tenu toute la nuit dans le sillage des vrais, et Amerigo le note sans rire, c'est la bonne compagnie. Lanterne rouge, Vasco de Gamelle, 92 075e, à 608 milles, qui a troqué la Guadeloupe contre «&nbsp;les canaris&nbsp;»&nbsp;: le Portugais renonce au Nouveau Monde, Amerigo s'en charge, comme la dernière fois.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>2\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full mapinner'>\u003ch2>Le Film des 24 h\u003c/h2>\u003cdiv class=\"sub\">Les routes des copains, de jeudi 18 h à vendredi 18 h\u003c/div>\u003cdiv class=\"mapbox\">\u003csvg class=\"map\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carte animée des trajectoires des copains\">\u003c/svg>\u003c/div>\u003cdiv class=\"mapbar\">\u003cspan id=\"clock\">\u003c/span>\u003cbutton class=\"replay\" type=\"button\">↻ Rejouer\u003c/button>\u003c/div>\u003cdiv class=\"mapnote\">Un point par bateau, \u003ci>Amerigo\u003c/i> en rouge sang de bœuf.\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>3\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003ch2>Nouvelle version du journal\u003c/h2>\u003cp>Le Times change de peau ce soir&nbsp;: un vrai journal qu'on feuillette du pouce, plus beau que la maquette d'en face et plus vrai sur le fond, puisqu'il raconte une course que son auteur mène. Plus doux pour Christof Cancer du Colon&nbsp;? Non&nbsp;: les bons points restent chez la concurrence, ici on garde les claques. Flouté, avec des X sur les passages salés, pour Kéké Gabart&nbsp;? Non plus&nbsp;; à 211 milles dans la journée, le plus petit kilométrage de la flotte, elle a le temps de tout lire, et même de demander si les collisions sont possibles&nbsp;: elle cherche ce qu'il lui reste à essayer. À lire avec le son&nbsp;: on y entend le vent dans la voile d'Amerigo et, très loin derrière, un bruit de bouchon.\u003c/p>\u003ch2>Défi lancé six vus zéro réponse\u003c/h2>\u003cp class=\"split\">Six «&nbsp;vu&nbsp;» en deux heures, pas un gant levé. Le seul volontaire, Vasco de Gamelle, s'est engagé pour lundi, top 5 promis&nbsp;; Amerigo ne prend pas de rendez-vous aussi loin. Magegland a répondu «&nbsp;si un des gars arrive à te coiffer au poteau&nbsp;»&nbsp;: même pour se battre, il délègue. Il promet de ressortir tout ce qu'Amerigo a dit&nbsp;; Amerigo le remercie, il cherchait justement\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>4\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">quelqu'un pour archiver ses exploits. Isa Autissier-de-Poche a bien crié «&nbsp;putain ça m'énerve&nbsp;», mais à son propre bateau, arrêté deux fois dans l'après-midi, 71 746e&nbsp;: de la Grande Gueule de Ré, il ne reste que la gueule.\u003c/p>\u003ch2>La moitié du Camembert\u003c/h2>\u003cp>À 16 h 14, Jean Le Camembert a annoncé la mi-course, «&nbsp;rien n'est fait, détends-toi&nbsp;», en revenant à 14 milles, 524 milles dans la journée, trois de plus qu'Amerigo. Trois milles de plus pour rester derrière, c'est un fromage qui court après son plateau. La moitié du parcours est passée, et le camembert est toujours au même endroit&nbsp;: derrière. Détendu, Amerigo l'est&nbsp;: il sait qui fermera la porte et qui restera sur le paillasson.\u003c/p>\u003ch2>Le talent de Christof à 43 milles\u003c/h2>\u003cp class=\"split\">Christof Cancer du Colon est 3e, 4 731e, 548 milles à 23 nœuds de moyenne, plus vite qu'Amerigo pour continuer à le voir de dos. Depuis que la Contre-Gazette lui a décerné les félicitations du conseil, il la trouve «&nbsp;d'une telle douceur&nbsp;» qu'il menace de résilier le Times&nbsp;: le vainqueur du Vendée Globe se laisse acheter\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>5\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">par un bon point. Amerigo ne distribue pas de félicitations, il distribue des leçons, et la première est gratuite. «&nbsp;Les faits et son talent parlent pour lui&nbsp;», dit-il. Les faits disent 3e. Son talent parle aussi&nbsp;; à 43 milles, il faut juste tendre l'oreille.\u003c/p>\u003ch2>569 milles pour faire du surplace\u003c/h2>\u003cp>Magegland a abattu 569 milles, 24 nœuds de moyenne, le record de la flotte, pour être 6e ce matin et 6e ce soir, 14 291e&nbsp;: la Contre-Gazette ouvrira une bouteille pour le surplace, elle en a ouvert deux pour une 7e place. Elle réclame un correcteur pour le Times à cause d'un pot au noir absent de la route&nbsp;: Amerigo l'a traversé en avance, pour la prochaine course, et s'il n'est plus là, c'est qu'il a eu peur. La Direction de course cherche un correcteur&nbsp;; sa rédaction cherche surtout un skipper, le poste est vacant depuis le caillou de dimanche.\u003c/p>\u003ch2>Le journal de bord du capitaine\u003c/h2>\u003cp class=\"split\">Amerigo va être honnête, c'est sa seule faiblesse&nbsp;: il s'ennuie. Deux suiveurs ont repris quelques milles, et il faut qu'on sache pourquoi.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>6\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">Amerigo a levé le pied, par charité&nbsp;: un peloton qui perd le moral ne fait plus de bons figurants, et Amerigo tient à son décor. Il a assuré sa nuit de garde, les petits dorment, la tête de course aussi, bien au chaud sous son coude. Que les moussaillons gardent espoir, c'est bon pour le teint. Amerigo, lui, garde le cap, le rhum et la première place, dans cet ordre, et il ne lâchera aucun des trois.\u003c/p>\u003cblockquote class=\"pull\" style=\"margin-top: calc(20.0711rem);\">\u003cspan>Amerigo va être honnête, c'est sa seule faiblesse&nbsp;: il s'ennuie.\u003c/span>\u003c/blockquote>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>7\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full photoinner'>\u003ch2>La photo du jour\u003c/h2>\u003cfigure class=\"fig endfig\">\u003cimg class=\"zoom\" src=\"img/photo-fin.jpg\" width=\"1600\" height=\"922\" alt=\"La photo de fin\" data-fit=\"240\" data-fitmin=\"140\" style=\"--h: 24rem;\">\u003cfigcaption>La photo de fin\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Pièce à conviction de 13 h 51&nbsp;: 1 336e, 23 nœuds dans 20 de vent, pas une voile à l'horizon. Même le vent n'arrive plus à suivre Amerigo, il a fallu lui laisser un peu d'avance.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>8\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full photoinner'>\u003ch2>À bord avec Amerigo\u003c/h2>\u003cfigure class=\"fig endfig\">\u003cimg class=\"zoom\" src=\"img/bord.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin de bord\" data-fit=\"240\" data-fitmin=\"140\" style=\"--h: 24rem;\">\u003cfigcaption>Le dessin de bord\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo, pieds sur la barre, un cornet acoustique vissé à l'oreille et pointé vers l'arrière, tente d'entendre un talent à 43 milles&nbsp;; derrière lui, le vent, essoufflé, demande une pause.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>9\u003c/b>\u003cspan>6 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full rankinner'>\u003cdiv class=\"banc\">\u003cdiv class=\"title\" data-fitw=\"\">Le Banc des Moussaillons\u003c/div>\u003cdiv class=\"when\">Classement des copains, vendredi 6 novembre 2026\u003c/div>\u003ctable>\u003cthead>\u003ctr class=\"grp\">\u003cth colspan=\"4\">\u003c/th>\u003cth colspan=\"2\" class=\"g24\">Dernières 24 h\u003c/th>\u003c/tr>\u003ctr>\u003cth>\u003c/th>\u003cth class=\"nm\">Moussaillon\u003c/th>\u003cth>Au gén.\u003c/th>\u003cth>Écart\u003csmall>milles\u003c/small>\u003c/th>\u003cth class=\"s24\">Milles\u003c/th>\u003cth>Vit. moy.\u003csmall>nœuds\u003c/small>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"me\">\u003ctd class=\"r\">1\u003c/td>\u003ctd class=\"nm long\">\u003cb>Amerigo Vespuzizi\u003c/b>\u003c/td>\u003ctd class=\"g\">1 433\u003csup>e\u003c/sup>\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"s24\">528\u003c/td>\u003ctd>22,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">2\u003c/td>\u003ctd class=\"nm long\">\u003cb>Jean Le Camembert\u003c/b>\u003c/td>\u003ctd class=\"g\">2 227\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+14,2\u003c/td>\u003ctd class=\"s24\">531\u003c/td>\u003ctd>22,2\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">3\u003c/td>\u003ctd class=\"nm long\">\u003cb>Christof Cancer du Colon\u003c/b>\u003c/td>\u003ctd class=\"g\">4 731\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+42,5\u003c/td>\u003ctd class=\"s24\">555\u003c/td>\u003ctd>23,2\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">4\u003c/td>\u003ctd class=\"nm long\">\u003cb>Loïc Peyronladdition\u003c/b>\u003c/td>\u003ctd class=\"g\">8 485\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+70,6\u003c/td>\u003ctd class=\"s24\">512\u003c/td>\u003ctd>21,4\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">5\u003c/td>\u003ctd class=\"nm\">\u003cb>Maud Fontenoyade\u003c/b>\u003c/td>\u003ctd class=\"g\">8 803\u003
