<script type="application/json" id="nvt-data">{"pages":["\u003cdiv class='inner une'>\u003cdiv class=\"une-top\">\u003cdiv class=\"ear\">Le seul quotidien\u003cbr>lu à la barre\u003c/div>\u003cdiv class=\"thenew\" data-fitw=\"\">The New\u003c/div>\u003cdiv class=\"seal\">\u003cb>n°\u003c/b>\u003cspan>7\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"mast\" data-fitw=\"\" style=\"font-size: 5.9rem;\">Vespuzizi Times\u003c/div>\u003chr class=\"rule\">\u003chr class=\"rule2\">\u003cdiv class=\"date\" style=\"margin-bottom: calc(7.4rem);\">\u003cspan>samedi 7 novembre 2026\u003c/span>\u003cspan>Route du Rhum, jour 7\u003c/span>\u003c/div>\u003cfigure class=\"une-fig\" style=\"margin-bottom: calc(7.3rem);\">\u003cdiv class=\"frame\">\u003cimg class=\"zoom\" src=\"img/dessin.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin du jour\">\u003c/div>\u003cfigcaption>Le dessin du jour\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo, assis sur sa coque, une chaîne de dix anneaux dans la main&nbsp;; au bout, un petit chien blanc à flamme rouge montre les crocs à un bateau noir au cœur rose qui lui fait coucou, et la chaîne ne bouge pas d'un pouce.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>1\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003ch2 class=\"headline\">Soixante heures de laisse : la flotte au bout de la chaîne\u003c/h2>\u003cp class=\"lead\">Jour 7. 2 473 milles au compteur, 2 660e au relevé de 17 h 53. Avance à l'heure du pointage&nbsp;: 19 milles jeudi, 14 vendredi, 20 ce soir. Le mou de vendredi&nbsp;? Un prêt, remboursé avec intérêts. Dix bateaux tirent sur la chaîne, Amerigo tient l'autre bout, d'une main. Figure de proue&nbsp;: encore 1 742 places sur le 918e d'Isa Autissier-de-Poche, le 2 novembre. La laisse est longue. La main ne tremble pas.\u003c/p>\u003cfigure class=\"fig inline\" style=\"--h: 20.350739432011515rem;\">\u003cimg class=\"zoom\" src=\"img/photo-1.jpg\" width=\"1600\" height=\"1047\" alt=\"0 h 41. Amerigo à 20 nœuds sous spi, cinq poursuivants à portée de projecteur. Un mouchoir de poche, oui. C\" est=\"\" amerigo=\"\" qui=\"\" tient=\"\" le=\"\" mouchoir.'=\"\">\u003cfigcaption>0 h 41. Amerigo à 20 nœuds sous spi, cinq poursuivants à portée de projecteur. Un mouchoir de poche, oui. C'est Amerigo qui tient le mouchoir.\u003c/figcaption>\u003c/figure>\u003ch2>La flotte\u003c/h2>\u003cp class=\"split\">Au pointage de 17 h 51, Amerigo mène de 20 milles. Soixante-quatre heures en tête depuis le\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>2\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full mapinner'>\u003ch2>Le Film des 24 h\u003c/h2>\u003cdiv class=\"sub\">Les routes des copains, de vendredi 18 h à samedi 18 h\u003c/div>\u003cdiv class=\"mapbox\">\u003csvg class=\"map\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carte animée des trajectoires des copains\">\u003c/svg>\u003c/div>\u003cdiv class=\"mapbar\">\u003cspan id=\"clock\">\u003c/span>\u003cbutton class=\"replay\" type=\"button\">↻ Rejouer\u003c/button>\u003c/div>\u003cdiv class=\"mapnote\">Un point par bateau, \u003ci>Amerigo\u003c/i> en rouge sang de bœuf.\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>3\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">départ, cumulées. Personne d'autre n'a tenu deux jours.\u003c/p>\u003cp>En tête. Jean Le Camembert (4 913e) talonne, à 20 milles, six de plus qu'hier. 432 milles dans la journée, deux de moins que le patron. Le fromage colle au plateau. Le plateau avance plus vite.\u003c/p>\u003cp>Le podium. Loïc Peyronladdition (3 508e) grignote 8 milles et pointe 3e. Amerigo le reconnaît&nbsp;: la plus belle remontée du podium. À ce rythme, il le rejoint pour la prochaine Route du Rhum.\u003c/p>\u003cp>Le peloton. Maud Fontenoyade (49 927e) tient la 6e place.\u003c/p>\u003cp>La cale. Isa Autissier-de-Poche (74 666e) reprend 23 milles, 8e. Elle réclamait le vent dans le dos&nbsp;: Amerigo lui a laissé le sien, il avait fini avec. Kéké Gabart (81 214e), 9e, entre ce soir dans une zone de vent mou&nbsp;: la motricité fine passe au point mort. Ananas Tabarly (82 884e) recule de 6 milles, 10e. Même un ananas en boîte voyage plus vite. Lanterne rouge, Vasco de Gamelle (90 583e), à 622 milles, 17 de plus qu'hier&nbsp;: le Portugais recule même vers les Canaries.\u003c/p>\u003cp>Demain&nbsp;? Le deuxième à 20 milles, et un patron qui ne prête plus rien.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>4\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cdiv class=\"encart chiffre\">\u003cdiv class=\"k\">Le chiffre\u003c/div>\u003cb>60\u003c/b>\u003cspan>heures de tête sans interruption depuis jeudi 5 h 41, et pas une seule main venue tirer sur la chaîne.\u003c/span>\u003c/div>\u003ch2>Le chien au bout de la chaîne\u003c/h2>\u003cp>Magegland fait coucou à Christof Cancer du Colon, GIF de Forrest Gump à l'appui, en lâchant 33 milles dans la journée. Même pour saluer, il recule.\u003c/p>\u003cp>Christof (25 773e) répond par un chien qui montre les crocs. Impressionnant. Sauf qu'il pointe 4e, à 95 milles d'Amerigo, et qu'il en a perdu 51 depuis hier. Un chien méchant, ça inquiète. Un chien méchant au bout d'une chaîne de 95 milles, ça attendrit.\u003c/p>\u003cp>«&nbsp;Quali, bien, mieux, travaillé, sérieux&nbsp;», disait-il du Times avant de résilier. Les cinq premiers mots sont encadrés. Le sixième, c'est l'avis d'un 4e.\u003c/p>\u003ch2>Le saucisson sort de sa cave\u003c/h2>\u003cp class=\"split\">449 milles en vingt-quatre heures, 19 nœuds de\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>5\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">moyenne, record du jour. Olivier de Kersaucisson (42 315e) reprend 69 milles sur Amerigo et pointe 7e. Zéro message dans le groupe.\u003c/p>\u003cp>Le Brestois ne parle pas, il sèche. Absent au départ, il double tout le monde une semaine plus tard. Le saucisson vegan a trouvé la recette&nbsp;: le gras, c'est au classement. À 247 milles, il remonte sur la photo de famille. Au dernier rang, mais en cravate.\u003c/p>\u003cfigure class=\"fig inline\" style=\"--h: 20.370734263444028rem;\">\u003cimg class=\"zoom\" src=\"img/photo-2.jpg\" width=\"1600\" height=\"1048\" alt=\"13 h 06, échelle 40 milles&nbsp;: la flotte se resserre derrière Amerigo, et un bateau blanc à flamme verte entre dans le cadre, tout à droite. Olivier de Kersaucisson arrive sur la photo. En retard, comme au départ.\">\u003cfigcaption>13 h 06, échelle 40 milles&nbsp;: la flotte se resserre derrière Amerigo, et un bateau blanc à flamme verte entre dans le cadre, tout à droite. Olivier de Kersaucisson arrive sur la photo. En retard, comme au départ.\u003c/figcaption>\u003c/figure>\u003ch2>Revue de presse du large\u003c/h2>\u003cp class=\"split\">Le Moniteur du Ponton titre «&nbsp;Premier à 4 h, deuxième au réveil&nbsp;». Jean Le Camembert a juré&nbsp;: «&nbsp;J'ai pas empanné cette nuit&nbsp;!&nbsp;», puis «&nbsp;Et j'étais 1er à 4h cette nuit 😉&nbsp;». Une tête de\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>6\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">course sans témoin ni classement&nbsp;: même Amerigo n'a jamais osé.\u003c/p>\u003cp>L'Écho des Alizés relève son verdict, «&nbsp;Un peu romancé l'édition du matin 😅&nbsp;». Et conclut&nbsp;: pas d'empannage, donc pas de freinage tardif. Il n'a pas freiné du tout. De la constance.\u003c/p>\u003cp>La Contre-Gazette de Magegland&nbsp;? «&nbsp;Les rotatives chauffent&nbsp;», dit-il. Celles du Times tournent à froid&nbsp;: un seul nom en tête, ça ne demande aucun effort.\u003c/p>\u003ch2>Le journal de bord du capitaine\u003c/h2>\u003cp>Amerigo a la laisse dans une main et le rhum dans l'autre. Les deux tiennent. Il entend grogner derrière, loin, et ça lui fait plaisir&nbsp;: un chenil silencieux, c'est triste. «&nbsp;Qu'ils tirent, ça les muscle&nbsp;», glisse-t-il. Il a même laissé un peu de mou au deuxième, par bonté. Un deuxième qui voit le premier se sent important. Amerigo ne se sent rien&nbsp;: il est. Sa soirée&nbsp;? Tranquille, pas immobile, la nuance échappe aux journaux d'en face. Pas de faux pas d'ici le ponton. Le chef de meute ne trébuche pas, il choisit où il pose la patte. Les autres arriveront quand on sifflera.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>7\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full photoinner'>\u003ch2>À bord avec Amerigo\u003c/h2>\u003cfigure class=\"fig endfig\">\u003cimg class=\"zoom\" src=\"img/bord.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin de bord\" data-fit=\"240\" data-fitmin=\"140\" style=\"--h: 24rem;\">\u003cfigcaption>Le dessin de bord\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo à la barre, veste bleu marine et rouge, une chaîne enroulée au poignet qui file par-dessus la poupe jusqu'à l'horizon&nbsp;; il la tient d'un doigt, le rhum dans l'autre main, sans se retourner.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>8\u003c/b>\u003cspan>7 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full rankinner'>\u003cdiv class=\"banc\">\u003cdiv class=\"title\" data-fitw=\"\">Le Banc des Moussaillons\u003c/div>\u003cdiv class=\"when\">Classement des copains, samedi 7 novembre 2026, relevé de 17 h 51 · Amerigo au général : 2 660e au relevé de 17 h 53\u003c/div>\u003ctable>\u003cthead>\u003ctr class=\"grp\">\u003cth colspan=\"4\">\u003c/th>\u003cth colspan=\"2\" class=\"g24\">Dernières 24 h\u003c/th>\u003c/tr>\u003ctr>\u003cth>\u003c/th>\u003cth class=\"nm\">Moussaillon\u003c/th>\u003cth>Au gén.\u003c/th>\u003cth>Écart\u003csmall>milles\u003c/small>\u003c/th>\u003cth class=\"s24\">Milles\u003c/th>\u003cth>Vit. moy.\u003csmall>nœuds\u003c/small>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"me\">\u003ctd class=\"r\">1\u003c/td>\u003ctd class=\"nm long\">\u003cb>Amerigo Vespuzizi\u003c/b>\u003c/td>\u003ctd class=\"g\">2 660\u003csup>e\u003c/sup>\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"s24\">434\u003c/td>\u003ctd>18,3\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">2\u003c/td>\u003ctd class=\"nm long\">\u003cb>Jean Le Camembert\u003c/b>\u003c/td>\u003ctd class=\"g\">4 913\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+20,1\u003c/td>\u003ctd class=\"s24\">432\u003c/td>\u003ctd>18,2\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">3\u003c/td>\u003ctd class=\"nm long\">\u003cb>Loïc Peyronladdition\u003c/b>\u003c/td>\u003ctd class=\"g\">3 508\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+62,0\u003c/td>\u003ctd class=\"s24\">427\u003c/td>\u003ctd>18,0\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">4\u003c/td>\u003ctd class=\"nm long\">\u003cb>Christof Cancer du Colon\u003c/b>\u003c/td>\u003ctd class=\"g\">25 773\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+94,6\u003c/td>\u003ctd class=\"s24\">398\u003c/td>\u003ctd>16,8\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">5\u003c/td>\u003ctd class=\"nm\">\u003cb>Magegland\u003c/b>\u003c/td>\u003ctd class=\"g\">32 901\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+136,3\u003c/td>\u003ctd class=\"s24\">405\u003c/td>\u003ctd>17,1\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"r\">6\u003c/td>\u003ctd class=\"nm\">\u003cb>Maud Fontenoyade\u003c/b>\u003cspan class=\"tag low\">pire 24 h\u003c/span>\u003c/td>\u003ctd class=\"g\">49 927\u003csup>e\u003c/sup>\u003c/td>\u003ctd>+215,1\u003c/td>\u003ctd class=\"s24\">369\u003c/td>\u003ctd>15,
