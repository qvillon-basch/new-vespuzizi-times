<script type="application/json" id="nvt-data">{"pages":["\u003cdiv class='inner une'>\u003cdiv class=\"une-top\">\u003cdiv class=\"ear\">Le seul quotidien\u003cbr>lu à la barre\u003c/div>\u003cdiv class=\"thenew\" data-fitw=\"\">The New\u003c/div>\u003cdiv class=\"seal\">\u003cb>n°\u003c/b>\u003cspan>9\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"mast\" data-fitw=\"\" style=\"font-size: 5.9rem;\">Vespuzizi Times\u003c/div>\u003chr class=\"rule\">\u003chr class=\"rule2\">\u003cdiv class=\"date\" style=\"margin-bottom: calc(7.06797rem);\">\u003cspan>lundi 9 novembre 2026\u003c/span>\u003cspan>Route du Rhum, jour 9\u003c/span>\u003c/div>\u003cfigure class=\"une-fig\" style=\"margin-bottom: calc(6.96797rem);\">\u003cdiv class=\"frame\">\u003cimg class=\"zoom\" src=\"img/dessin.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin du jour\">\u003c/div>\u003cfigcaption>Le dessin du jour\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Pétole livrée à domicile&nbsp;: Amerigo se fait son vent au ventilateur et sourit, pendant que Magegland évente sa voile à coups de copies, que Christof rame et que Jean Le Camembert noie son calme plat dans la bouteille.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>1\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003ch2 class=\"headline\">Le vent obéit : Amerigo souffle, la flotte rame\u003c/h2>\u003cp class=\"lead\">Jour 9. 3 273 milles dans le sillage, plus de cent heures en tête des copains. Ce matin, Amerigo a prévenu&nbsp;: le vent tomberait derrière lui. Il est tombé. Devant, un seul souffle suffit, le sien. Derrière, on sort les rames. La pétole est livrée à domicile, sans frais de port. La flotte réglera la bouteille.\u003c/p>\u003ch2>La flotte\u003c/h2>\u003cp>Au pointage de 17 h 41, Amerigo mène de 29,3 milles. Personne n'a bougé jusqu'à la septième place&nbsp;: le classement est figé, comme le vent.\u003c/p>\u003cp>En tête. Jean Le Camembert (1 983e) grignote 14 milles. 447 dans la journée, quatre de plus que le patron. Il court plus. Il voit la même poupe.\u003c/p>\u003cp>Le podium. Loïc Peyronladdition (4 493e), 3e, lâche 8 milles. Magegland (8 121e) en lâche 27. Le rédacteur recule plus vite qu'il n'écrit.\u003c/p>\u003cp class=\"split\">Le peloton. Christof Cancer du Colon (12 284e) reprend 11 milles, 5e. Maud\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>2\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full mapinner'>\u003ch2>Le Film des 24 h\u003c/h2>\u003cdiv class=\"sub\">Les routes des copains, de dimanche 18 h à lundi 18 h\u003c/div>\u003cdiv class=\"mapbox\">\u003csvg class=\"map\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carte animée des trajectoires des copains\">\u003c/svg>\u003c/div>\u003cdiv class=\"mapbar\">\u003cspan id=\"clock\">\u003c/span>\u003cbutton class=\"replay\" type=\"button\">↻ Rejouer\u003c/button>\u003c/div>\u003cdiv class=\"mapnote\">Un point par bateau, \u003ci>Amerigo\u003c/i> en rouge sang de bœuf.\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>3\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">Fontenoyade (13 412e) en reprend 23, 6e, proprement. Olivier de Kersaucisson (27 602e) perd 72 milles, 7e. Le Brestois a disparu des écrans&nbsp;; le bateau continue sans lui, comme au départ.\u003c/p>\u003cp>La cale. Ananas Tabarly (64 641e) passe 8e devant Isa Autissier-de-Poche (79 679e). Kéké Gabart (80 029e), 10e, 209 milles&nbsp;: la motricité fine tourne au ralenti. Lanterne rouge, Vasco de Gamelle (88 464e), à 981 milles. Le Portugais découvre l'Amérique à la vitesse d'une caravelle.\u003c/p>\u003cp>Demain&nbsp;? Le fromager à 29 milles, et plus un souffle pour lui. Le patron ferme la porte.\u003c/p>\u003cdiv class=\"encart chiffre\">\u003cdiv class=\"k\">Le chiffre\u003c/div>\u003cb>909\u003c/b>\u003cspan>le rang d'Amerigo à 18 h 10, le meilleur de la bande depuis Saint-Malo. La proue est à lui.\u003c/span>\u003c/div>\u003ch2>Isa rend la figure de proue\u003c/h2>\u003cp class=\"split\">918e. C'était le 2 novembre, et Isa Autissier-de-Poche réclamait le titre de figure de\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>4\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">proue, «&nbsp;comme vous êtes tous derrière moi&nbsp;». Au relevé de 17 h 48, Amerigo pointe 916e. La proue change de bateau.\u003c/p>\u003cp>Son ancienne porteuse aligne 188 milles en vingt-quatre heures, le plus petit total de la flotte. Tous derrière elle&nbsp;? Elle a retourné la carte. Amerigo tient la tête et la proue. Le bateau est à lui, d'un bout à l'autre.\u003c/p>\u003ch2>L'intérieur se fait de loin\u003c/h2>\u003cp>«&nbsp;On fait durer le suspense&nbsp;?&nbsp;», propose Jean Le Camembert à 11 h 30. «&nbsp;Je vais te faire l'intérieur autour de la Guadeloupe.&nbsp;» Pour faire l'intérieur, il faut être à côté. À 29 milles, le fromager ne fait pas l'intérieur, il fait le large.\u003c/p>\u003cp>Amerigo lui laisse tout l'extérieur&nbsp;: l'Atlantique. Le tour de l'île&nbsp;? Sa spécialité. Le suspense durera&nbsp;: le vent est tombé chez le camembert. Il aura le temps d'affiner. Bonne nuit.\u003c/p>\u003ch2>Le quatrième homme Pointe troisième\u003c/h2>\u003cp class=\"split\">«&nbsp;Le quatrième homme&nbsp;», titrait la Contre-Gazette ce matin&nbsp;: Loïc Peyronladdition sorti\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>5\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">du podium. À 17 h 41, il y est. Troisième, à 72,5 milles. La une a tenu dix heures. Imprimée au petit-déjeuner, périmée au goûter.\u003c/p>\u003cp>Le rédacteur, lui, a glissé derrière l'homme qu'il enterrait. Magegland écrit vite et navigue lentement. Quand il met quelqu'un en une, il prend sa place. Au classement, pas sur le podium.\u003c/p>\u003ch2>501 milles le record est jaune\u003c/h2>\u003cp>Le record du jour est jaune. Maud Fontenoyade aligne 501 milles en vingt-quatre heures, 20,8 nœuds de moyenne. Le plus gros total de la flotte. La seule des copains au-dessus des 500, plus que le patron.\u003c/p>\u003cp>Amerigo l'a vu de son bord&nbsp;: bien réglé, bien tenu, sans un trait de gomme. Il n'a rien à redire, lui qui cherche volontiers. Le Times le note sobrement&nbsp;: la Mayenne sait barrer.\u003c/p>\u003ch2>Le calme plat n'attend que les suivants\u003c/h2>\u003cp class=\"split\">11 h 22. Amerigo annonce le trou de vent devant Pointe-à-Pitre et conseille à ses poursuivants d'appuyer. Ce soir, sept d'entre eux sont dans le calme, quel que soit leur cap. Lui est\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>6\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"cont\">passé. Le vent lit le Times et respecte l'ordre d'arrivée.\u003c/p>\u003cp>Christof Cancer du Colon rame en tête de la file. Le «&nbsp;marathonien&nbsp;» du canard d'en face n'a abattu que 436 milles, le plus petit total des six premiers. Le vainqueur du Vendée Globe découvre l'aviron. Amerigo parle au vent. Le vent obéit. Aux autres, il ne répond plus.\u003c/p>\u003ch2>Le journal de bord du capitaine\u003c/h2>\u003cp>Amerigo a sorti le marteau ce soir. Quelques clous, un bout de bois taillé à sa gloire, et l'étrave a enfin le visage qu'elle méritait&nbsp;: le sien. Neuf jours qu'il tirait ce bateau avec une proue anonyme. Scandaleux. Derrière, ça souffle dans les voiles à la force des joues, ça rame, ça relit le canard d'en face pour passer le temps. «&nbsp;Un calme plat, ça se mérite&nbsp;: Amerigo le leur a laissé&nbsp;», lâche-t-il, le rhum calé dans le winch. Dormir&nbsp;? Pas ce soir. On ne ferme pas l'œil quand on porte tout le bateau, de la tête à la proue. Les moussaillons, eux, peuvent dormir. Ils n'avancent plus de toute façon.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>7\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full photoinner'>\u003ch2>À bord avec Amerigo\u003c/h2>\u003cfigure class=\"fig endfig\">\u003cimg class=\"zoom\" src=\"img/bord.jpg\" width=\"1536\" height=\"1024\" alt=\"Le dessin de bord\" data-fit=\"240\" data-fitmin=\"140\" style=\"--h: 24rem;\">\u003cfigcaption>Le dessin de bord\u003c/figcaption>\u003c/figure>\u003cp class=\"legend\">Amerigo caresse sa nouvelle proue, rhum calé sur le winch, pendant que Jean Le Camembert hurle à l'écume et que Maud, Christof et Isa prennent les embruns de loin&nbsp;: le dragon avance, la flotte admire.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>8\u003c/b>\u003cspan>9 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full rankinner'>\u003cdiv class=\"banc\" style=\"--rowpad: 0.34rem;\">\u003cdiv class=\"title\" data-fitw=\"\">Le Banc des Moussaillons\u003c/div>\u003cdiv class=\"when\">Classement des copains, lundi 9 novembre 2026, classement du jeu à 17 h 41 · Amerigo au général : 916e au relevé de 17 h 48\u003c/div>\u003ctable>\u003cthead>\u003ctr class=\"grp\">\u003cth colspan=\"4\">\u003c/th>\u003cth colspan=\"2\" class=\"g24\">Dernières 24 h\u003c/th>\u003c/tr>\u003ctr>\u003cth>\u003c/th>\u003cth class=\"nm\">Moussaillon\u003c/th>\u003cth>Au gén.\u003c/th>\u003cth>Écart\u003csmall>milles\u003c/small>\u003c/th>\u003cth class=\"s24\">Milles\u003c/th>\u003cth>Vit. moy.\u003csmall>nœuds\u003c/small>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr class=\"me\">\u003ctd class=\"r\">1\u003c/td>\u003ctd class=\"nm long\">\u003cb>Amerigo Vespuzizi\u003c/b>\u003c/td>\u003ctd class=\"g\">91
