<script type="application/json" id="nvt-data">{"pages":["\u003cdiv class='inner une'>\u003cdiv class=\"une-top\">\u003cdiv class=\"ear\">Le seul quotidien\u003cbr>lu à la barre\u003c/div>\u003cdiv class=\"thenew\" data-fitw=\"\">The New\u003c/div>\u003cdiv class=\"seal\">\u003cb>n°\u003c/b>\u003cspan>11\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"mast\" data-fitw=\"\" style=\"font-size: 5.9rem;\">Vespuzizi Times\u003c/div>\u003chr class=\"rule\">\u003chr class=\"rule2\">\u003cdiv class=\"date\">\u003cspan>mercredi 11 novembre 2026\u003c/span>\u003cspan>Route du Rhum, jour 11\u003c/span>\u003c/div>\u003cfigure class=\"une-fig\">\u003cdiv class=\"frame\">\u003cimg class=\"zoom\" src=\"img/chap-1.jpg\" width=\"1535\" height=\"1024\" alt=\"Tout chaud sorti des rotatives\">\u003c/div>\u003cfigcaption>Tout chaud sorti des rotatives\u003c/figcaption>\u003c/figure>\u003ch2 class=\"headline\">Amerigo garde son titre, sans toucher la barre\u003c/h2>\u003ch2>Un tour d'honneur grand comme l'océan\u003c/h2>\u003cp class=\"iv-chapeau split\">Vainqueur en Guadeloupe, Amerigo savoure. Mais derrière le sourire, le skipper réserve à\u003c/p>\u003cdiv class=\"suite\">Suite page 2 ▸\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>1\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cdiv class=\"kicker\">Suite de la Une\u003c/div>\u003cp class=\"iv-chapeau cont\">ses lecteurs une confidence qu'il n'a encore faite à personne.\u003c/p>\u003cp class=\"iv-q\">Amerigo, vous voilà à terre, en Guadeloupe. Comment vous sentez-vous&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Très bien&nbsp;! Je suis très fier de cette course, et heureux d'avoir conservé mon titre. La fin a été interminable&nbsp;: j'aurais aimé arriver plus tôt, mais le tour d'honneur n'en a été que plus long. Et je suis très satisfait de mon classement mondial, le meilleur de ma carrière. La course a été très plaisante, avec beaucoup de rivalité, autant sur l'eau que dans les journaux&nbsp;!\u003c/p>\u003cp class=\"iv-q\">Dans les journaux, justement, Magegland et sa Contre-Gazette ne vous ont pas épargné. Il vous a même déclaré la guerre. On dirait pourtant que vous lui devez quelque chose…\u003c/p>\u003cp class=\"iv-a\">Beaucoup. Sans lui, la course aurait été bien plus calme, et bien moins drôle.\u003c/p>\u003ch2>Un pilote, zéro ordre, un titre\u003c/h2>\u003cp class=\"iv-chapeau\">Promise ce matin sur le quai, la grande révélation arrive enfin. Elle pourrait bien changer la façon dont ses copains regardent la course.\u003c/p>\u003cp class=\"iv-q\">Ce matin, à l'arrivée, vous nous avez laissés sur notre faim&nbsp;: «&nbsp;Je vous en dirai plus ce soir.&nbsp;» Nous y sommes.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>2\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iv-a\">Alors voilà&nbsp;: je n'étais pas à bord.\u003c/p>\u003cfigure class=\"fig inline\" style=\"--h: 20.733333333333334rem;\">\u003cimg class=\"zoom\" src=\"img/chap-2.jpg\" width=\"1536\" height=\"1024\" alt=\"Un pilote, zéro ordre, un titre\">\u003cfigcaption>Mi-homme, mi-machine\u003c/figcaption>\u003c/figure>\u003cp class=\"iv-q\">Pas à bord&nbsp;? Mais alors, qui barrait&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Un pilote automatique. Je n'ai donné aucun ordre moi-même&nbsp;: pas un changement de cap, pas un changement de voile. Je me contentais de le surveiller de temps en temps, grâce aux données qu'il collectait et aux notifications qu'il m'envoyait sur mon téléphone.\u003c/p>\u003cp class=\"iv-q\">Un pilote automatique… Derrière, on imagine une intelligence artificielle aux commandes.\u003c/p>\u003cp class=\"iv-a split\">Elle m'a aidé à construire le pilote, et elle le surveillait en même temps que moi. Mais ce n'est pas elle qui pilotait. Le bateau était mené par une série de programmes. Ils lisaient les données du jeu (la position, le cap, la vitesse, la voile, l'énergie du marin) et les prévisions de\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>3\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iv-a cont\">vent. Ils calculaient la meilleure route et écartaient les variations trop faibles pour être significatives. Puis ils ajustaient le cap et changeaient les voiles. D'ailleurs, c'est la première course où l'intelligence artificielle est assez avancée pour permettre ce genre de prouesse. À l'avenir, il faudrait créer une catégorie à part, où les marins qui utilisent l'IA s'affrontent entre eux. Car je le reconnais&nbsp;: ce n'est pas équitable.\u003c/p>\u003cfigure class=\"iv-gal\" style=\"--cols:3\">\u003cdiv class=\"iv-thumbs\">\u003cspan class=\"iv-thumb\">\u003cimg class=\"zoom\" src=\"img/capture-1.jpg\" width=\"1206\" height=\"332\" alt=\"Capture d'écran 1\" tabindex=\"0\" role=\"button\" aria-label=\"Agrandir la capture 1\">\u003cspan class=\"iv-badge\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\">\u003c/circle>\u003cpath d=\"M15 15l6 6\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\">\u003c/path>\u003c/svg>\u003c/span>\u003c/span>\u003cspan class=\"iv-thumb\">\u003cimg class=\"zoom\" src=\"img/capture-2.jpg\" width=\"1206\" height=\"335\" alt=\"Capture d'écran 2\" tabindex=\"0\" role=\"button\" aria-label=\"Agrandir la capture 2\">\u003cspan class=\"iv-badge\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\">\u003c/circle>\u003cpath d=\"M15 15l6 6\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\">\u003c/path>\u003c/svg>\u003c/span>\u003c/span>\u003cspan class=\"iv-thumb\">\u003cimg class=\"zoom\" src=\"img/capture-3.jpg\" width=\"1206\" height=\"738\" alt=\"Capture d'écran 3\" tabindex=\"0\" role=\"button\" aria-label=\"Agrandir la capture 3\">\u003cspan class=\"iv-badge\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\">\u003c/circle>\u003cpath d=\"M15 15l6 6\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\">\u003c/path>\u003c/svg>\u003c/span>\u003c/span>\u003cspan class=\"iv-thumb\">\u003cimg class=\"zoom\" src=\"img/capture-4.jpg\" width=\"1206\" height=\"521\" alt=\"Capture d'écran 4\" tabindex=\"0\" role=\"button\" aria-label=\"Agrandir la capture 4\">\u003cspan class=\"iv-badge\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\">\u003c/circle>\u003cpath d=\"M15 15l6 6\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\">\u003c/path>\u003c/svg>\u003c/span>\u003c/span>\u003cspan class=\"iv-thumb\">\u003cimg class=\"zoom\" src=\"img/capture-5.jpg\" width=\"1206\" height=\"1192\" alt=\"Capture d'écran 5\" tabindex=\"0\" role=\"button\" aria-label=\"Agrandir la capture 5\">\u003cspan class=\"iv-badge\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\">\u003c/circle>\u003cpath d=\"M15 15l6 6\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\">\u003c/path>\u003c/svg>\u003c/span>\u003c/span>\u003cspan class=\"iv-thumb\">\u003cimg class=\"zoom\" src=\"img/capture-6.jpg\" width=\"1206\" height=\"1118\" alt=\"Capture d'écran 6\" tabindex=\"0\" role=\"button\" aria-label=\"Agrandir la capture 6\">\u003cspan class=\"iv-badge\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\">\u003c/circle>\u003cpath d=\"M15 15l6 6\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\">\u003c/path>\u003c/svg>\u003c/span>\u003c/span>\u003cspan class=\"iv-thumb\">\u003cimg class=\"zoom\" src=\"img/capture-7.jpg\" width=\"959\" height=\"1157\" alt=\"Capture d'écran 7\" tabindex=\"0\" role=\"button\" aria-label=\"Agrandir la capture 7\">\u003cspan class=\"iv-badge\" aria-hidden=\"true\">\u003csvg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" aria-hidden=\"true\">\u003ccircle cx=\"10\" cy=\"10\" r=\"6.5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\">\u003c/circle>\u003cpath d=\"M15 15l6 6\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\">\u003c/path>\u003c/svg>\u003c/span>\u003c/span>\u003c/div>\u003cfigcaption class=\"iv-hint\">Touchez une image pour l'agrandir\u003c/figcaption>\u003c/figure>\u003cp class=\"iv-q\">Pas équitable… Certains vont aller plus loin et crier à la triche.\u003c/p>\u003cp class=\"iv-a split\">Rien dans les règles ne l'interdisait. Magegland\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>4\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iv-a cont\">les avait d'ailleurs rappelées avant le départ.\u003c/p>\u003cfigure class=\"fig inline\" style=\"--h: 19.98714652956298rem;\">\u003cimg class=\"zoom\" src=\"img/capture-8.jpg\" width=\"417\" height=\"268\" alt=\"Les règles, rappelées le 24/10\">\u003cfigcaption>Les règles, rappelées le 24/10\u003c/figcaption>\u003c/figure>\u003ch2>Dix jours pour apprendre la mer\u003c/h2>\u003cp class=\"iv-chapeau\">Tout a commencé autour d'une table, dix jours avant Saint-Malo. Amerigo raconte la naissance de son secret, et ceux qui l'ont gardé avec lui.\u003c/p>\u003cp class=\"iv-q\">Revenons au début. Un pilote pareil, ça ne s'invente pas du jour au lendemain. D'où vient l'idée&nbsp;?\u003c/p>\u003cp class=\"iv-a\">D'une discussion avec Olivier de Kersaucisson, au cours d'une soirée, une dizaine de jours avant le départ.\u003c/p>\u003cp class=\"iv-q\">Une soirée, et dix jours plus tard, un bateau qui navigue seul. Qu'est-ce qui vous a poussé à vous lancer&nbsp;?\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>5\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cfigure class=\"fig inline\" style=\"--h: 20.74716477651768rem;\">\u003cimg class=\"zoom\" src=\"img/chap-3.jpg\" width=\"1535\" height=\"1024\" alt=\"Dix jours pour apprendre la mer\">\u003cfigcaption>Tout est parti d'une serviette\u003c/figcaption>\u003c/figure>\u003cp class=\"iv-a\">Pour gagner, bien sûr. Mais aussi pour le défi technique&nbsp;: je voulais savoir si c'était possible, et jusqu'où ça pouvait aller.\u003c/p>\u003cp class=\"iv-q\">Vous le dites simplement. Pourtant, ce n'est pas banal. Votre programme lit la météo de toute la planète, quinze jours à l'avance. Il trace des centaines de routes. Il passe les bouées obligatoires, évite les zones interdites et la terre ferme. Puis il choisit la meilleure et barre seul, jour et nuit, d'un bout à l'autre de l'Atlantique.\u003c/p>\u003cp class=\"iv-a\">C'est vrai. Et il n'a pas déçu&nbsp;: 1 499e au classement mondial, sur plus de 128 000 participants.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>6\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cdiv class=\"encart pointage iv-box\">\u003cdiv class=\"t\">Le pilote en chiffres\u003c/div>\u003cul>\u003cli>Premières lignes de code le 26 octobre, six jours avant le départ.\u003c/li>\u003cli>Plus de 14 000 lignes de code pour le pilote, et des milliers de tests pour le vérifier.\u003c/li>\u003cli>Le bateau surveillé toutes les 10 minutes, et la route entière recalculée toutes les heures, jour et nuit, pendant toute la traversée.\u003c/li>\u003cli>Chaque route tient compte des bouées de passage, des zones interdites et de la terre ferme.\u003c/li>\u003cli>La carte des vents du monde entier sur les quinze prochains jours, un point tous les 25 kilomètres environ, relue toutes les six heures.\u003c/li>\u003cli>Plus de 400 ordres envoyés au bateau depuis le départ, tous par le pilote.\u003c/li>\u003cli>Zéro ordre donné à la main.\u003c/li>\u003c/ul>\u003c/div>\u003cp class=\"iv-q\">Il doit bien y avoir des choses qu'il ne sait pas faire.\u003c/p>\u003cp class=\"iv-a\">Rien, il savait tout faire. Mais il a fallu l'entraîner. La semaine avant le départ, nous avons participé à d'autres courses pour le tester en conditions réelles.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>7\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iv-q\">Des essais en course, sous les yeux de tout le monde… Vous n'avez jamais eu peur d'être découvert&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Si, une fois. Le 3 novembre, Magegland m'a posé cette question dans le groupe. J'ai cru que j'étais grillé.\u003c/p>\u003cfigure class=\"fig inline\" style=\"--h: 13.316776569324313rem;\">\u003cimg class=\"zoom\" src=\"img/capture-9.jpg\" width=\"759\" height=\"325\" alt=\"La question du 3 novembre\">\u003cfigcaption>La question du 3 novembre\u003c/figcaption>\u003c/figure>\u003cp class=\"iv-q\">Grillé, mais personne n'a rien dit. Qui était dans la confidence&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Maud Fontenoyade et Christof Cancer du Colon. Merci à eux d'avoir gardé le secret&nbsp;: grâce à eux, j'ai pu tester le pilote en course en toute sérénité.\u003c/p>\u003ch2>Le Camembert ne lâche jamais la coque\u003c/h2>\u003cp class=\"iv-chapeau\">De Saint-Malo aux alizés, le skipper revient sur les doutes des premières nuits, les caprices de sa machine et l'adversaire qui ne l'a jamais quitté d'une coque.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>8\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iv-q\">Le 1er novembre à 13 h 02, à Saint-Malo, le pilote prend la mer pour de vrai. Comment vivez-vous ce départ&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Sereinement. J'avais surtout hâte de voir ma dernière création à l'œuvre.\u003c/p>\u003cp class=\"iv-q\">La sérénité ne dure pas&nbsp;: dès la première nuit, Isa Autissier-de-Poche passe devant vous.\u003c/p>\u003cp class=\"iv-a\">Un doute s'est installé&nbsp;: est-ce que le pilote était vraiment fiable&nbsp;? C'était un pari. Il fallait faire entièrement confiance à la machine, et je pouvais tout rater et perdre mon titre.\u003c/p>\u003cp class=\"iv-ndlr\">NDLR&nbsp;: Amerigo avait remporté l'édition 2022 de la Route du Rhum, 7 minutes devant Christof Cancer du Colon.\u003c/p>\u003cp class=\"iv-q\">Et le pilote, il a tenu ses promesses dès le départ&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Pas tout à fait. Au bout de deux ou trois jours, il s'est mis à zigzaguer. À chaque nouveau bulletin météo, à chaque nouveau calcul, il trouvait une route à peine meilleure et changeait d'avis. Le 2 novembre, il a changé de route une trentaine de fois. J'ai dû le reparamétrer&nbsp;: il ne change plus de route que si la nouvelle fait gagner au moins une demi-heure, deux calculs de suite. Depuis, à peine quelques changements par jour.\u003c/p>\u003cp class=\"iv-q split\">Puis viennent les duels. Jean Le Camembert,\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>9\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cfigure class=\"fig inline\" style=\"--h: 20.733333333333334rem;\">\u003cimg class=\"zoom\" src=\"img/chap-4.jpg\" width=\"1536\" height=\"1024\" alt=\"Le Camembert ne lâche jamais la coque\">\u003cfigcaption>Ameri-Bot à la barre\u003c/figcaption>\u003c/figure>\u003cp class=\"iv-q cont\">Christof Cancer du Colon, Loïc Peyronladdition, Magegland… Lequel vous a fait le plus peur&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Jean Le Camembert. Il ne m'a jamais lâché.\u003c/p>\u003cp class=\"iv-q\">Un duel pareil, jour et nuit… Vous n'avez donc pas fermé l'œil&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Si, très bien même. C'est tout le secret.\u003c/p>\u003ch2>Chapeau bas aux marins de chair\u003c/h2>\u003cp class=\"iv-chapeau\">Le vainqueur rend hommage à ceux qui l'ont poussé jusqu'au bout. Et il désigne, sans hésiter, celle qu'il tient pour la vraie skipper de la course.\u003c/p>\u003cp class=\"iv-q split\">Un pilote qui ne dort jamais, face à des marins qui barrent eux-mêmes&nbsp;: vous auriez dû\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>10\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iv-q cont\">les semer. Pourtant, ils ne finissent pas si loin…\u003c/p>\u003cp class=\"iv-a\">C'est vrai, et je les félicite tous, à commencer par Jean Le Camembert, qui finit juste derrière. Mais il faut le dire&nbsp;: aujourd'hui, tous les bateaux du jeu sont équipés d'un routeur. Un marin qui le suit bien a la même trajectoire que notre routeur fait maison. D'ailleurs, je pense que ceux qui se battent pour les premières places mondiales ont tous, en plus d'un pack payant, un pilote automatique. Selon moi, il est impossible de gagner sans ce genre d'outil. Sinon, soit ces gens n'ont pas de travail, soit ils ne dorment pas et ne font que ça pendant toute la course.\u003c/p>\u003cp class=\"iv-q\">Il y a une concurrente que vous n'avez pas citée&nbsp;: Maud Fontenoyade.\u003c/p>\u003cp class=\"iv-a\">C'est elle, la vraie skipper. Et en plus, elle barrait sans utiliser le routeur.\u003c/p>\u003cp class=\"iv-q\">Un tableau presque parfait, donc. Presque&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Oui. J'aurais aimé voir Christof Cancer du Colon plus haut au classement&nbsp;: son adversité m'a manqué&nbsp;!\u003c/p>\u003ch2>Cap sur le Vendée Globe\u003c/h2>\u003cp class=\"iv-chapeau\">Que devient le pilote une fois le rhum bu&nbsp;? Amerigo dévoile ses projets, et glisse une proposition à ses copains.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>11\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iv-q\">Et maintenant&nbsp;? Le pilote reprend la mer pour une prochaine course&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Oui, sur le prochain Vendée Globe. Pour se confronter aux meilleurs du monde, et essayer de décrocher quelques cadeaux.\u003c/p>\u003cp class=\"iv-q\">Vous le gardez pour vous, donc&nbsp;?\u003c/p>\u003cp class=\"iv-a\">Je le garde, mais je vends des licences dès aujourd'hui. Voyez les petites annonces.\u003c/p>\u003cfigure class=\"fig inline\" style=\"--h: 20.733333333333334rem;\">\u003cimg class=\"zoom\" src=\"img/chap-6.jpg\" width=\"1536\" height=\"1024\" alt=\"Cap sur le Vendée Globe\">\u003cfigcaption>À vendre, payable en rhum\u003c/figcaption>\u003c/figure>\u003cdiv class=\"iv-fin\">\u003cdiv class=\"orn\">✦ ✦ ✦\u003c/div>\u003cdiv class=\"sig\">Amerigo, simple passager de son propre bateau\u003c/div>\u003c/div>\u003cblockquote class=\"pull\" style=\"margin-top: calc(5.27578rem);\">\u003cspan>Sereinement. J'avais surtout hâte de voir ma dernière création à l'œuvre.\u003c/span>\u003c/blockquote>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>12\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full complinner'>\u003ch2>Les copains salués par Amerigo\u003c/h2>\u003cp class=\"iv-compl\">\u003cb>Jean Le Camembert\u003c/b>&nbsp;: Il ne m'a jamais lâché, de Saint-Malo aux Antilles. Le vrai duel de cette course, c'est lui.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Christof Cancer du Colon\u003c/b>&nbsp;: Une fin de course de champion. Le rival de toujours.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Loïc Peyronladdition\u003c/b>&nbsp;: Longtemps sur le podium, toujours à l'attaque. Un marin régulier, dangereux jusqu'au bout.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Magegland\u003c/b>&nbsp;: Il a animé la course comme personne, sur l'eau et dans sa Contre-Gazette. Sans lui, la traversée aurait été bien fade.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Maud Fontenoyade\u003c/b>&nbsp;: La vraie skipper de la famille, qui barre sans routeur.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Olivier de Kersaucisson\u003c/b>&nbsp;: Merci pour l'idée de départ. Il navigue avec la sagesse des vieux loups de mer.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Isa Autissier-de-Poche\u003c/b>&nbsp;: La seule à m'avoir fait douter, quand elle menait les copains au sud de l'Irlande. Chapeau.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Ananas Tabarly\u003c/b>&nbsp;: Elle n'a rien lâché, et a su remonter dans le classement au moment où tout se jouait.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>13\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full complinner'>\u003ch2>Les copains salués par Amerigo (suite)\u003c/h2>\u003cp class=\"iv-compl\">\u003cb>Kéké Gabart\u003c/b>&nbsp;: Elle a traversé des zones sans vent où d'autres auraient abandonné. Bien joué à elle.\u003c/p>\u003cp class=\"iv-compl\">\u003cb>Vasco de Gamelle\u003c/b>&nbsp;: Il est toujours en course, et c'est déjà une victoire. Respect pour sa persévérance.\u003c/p>\u003cfigure class=\"fig endfig iv-compl-fig\">\u003cimg class=\"zoom\" src=\"img/chap-5.jpg\" width=\"1535\" height=\"1024\" alt=\"Chapeau bas aux marins de chair\" data-fit=\"240\" data-fitmin=\"140\" style=\"--h: 24rem;\">\u003cfigcaption>La tournée du vainqueur\u003c/figcaption>\u003c/figure>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>14\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full raceinner'>\u003ch2>Le Film de la course\u003c/h2>\u003cdiv class=\"sub\">La 1re place des copains se loue&nbsp;: qui l'a tenue, et combien de temps, depuis le départ de Saint-Malo\u003c/div>\u003cdiv class=\"mapbox\">\u003csvg class=\"map\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Carte animée de la course des copains\">\u003c/svg>\u003c/div>\u003cdiv class=\"leader\">\u003c/div>\u003cdiv class=\"band\">\u003ci style=\"flex:5.900;background:#2F4B7C\" title=\"Jean\">\u003c/i>\u003ci style=\"flex:9.593;background:#7A6A2A\" title=\"Isa\">\u003c/i>\u003ci style=\"flex:1.387;background:#2E6B66\" title=\"Maud\">\u003c/i>\u003ci style=\"flex:2.497;background:#7A6A2A\" title=\"Isa\">\u003c/i>\u003ci style=\"flex:1.344;background:#7B1F14\" title=\"Amerigo\">\u003c/i>\u003ci style=\"flex:2.229;background:#2E6B66\" title=\"Maud\">\u003c/i>\u003ci style=\"flex:0.927;background:#2F4B7C\" title=\"Jean\">\u003c/i>\u003ci style=\"flex:0.856;background:#5B6B2E\" title=\"Loïc\">\u003c/i>\u003ci style=\"flex:2.809;background:#7A6A2A\" title=\"Isa\">\u003c/i>\u003ci style=\"flex:0.502;background:#7B1F14\" title=\"Amerigo\">\u003c/i>\u003ci style=\"flex:3.007;background:#2F4B7C\" title=\"Jean\">\u003c/i>\u003ci style=\"flex:2.023;background:#4B4B4B\" title=\"Kéké\">\u003c/i>\u003ci style=\"flex:2.349;background:#2F4B7C\" title=\"Jean\">\u003c/i>\u003ci style=\"flex:64.577;background:#7B1F14\" title=\"Amerigo\">\u003c/i>\u003cb class=\"rcursor\">\u003c/b>\u003c/div>\u003cdiv class=\"bandax\">\u003cspan>départ\u003c/span>\u003cspan>mercredi 11\u003c/span>\u003c/div>\u003cdiv class=\"mapbar\">\u003cspan class=\"clock\">\u003c/span>\u003cbutton class=\"replay\" type=\"button\">↻ Rejouer\u003c/button>\u003c/div>\u003cdiv class=\"lessees\">Locataires de la 1re place&nbsp;: \u003cb style=\"color:#7B1F14\">Amerigo\u003c/b>&nbsp;156&nbsp;h, \u003cb style=\"color:#7A6A2A\">Isa\u003c/b>&nbsp;35&nbsp;h, \u003cb style=\"color:#2F4B7C\">Jean\u003c/b>&nbsp;29&nbsp;h, \u003cb style=\"color:#2E6B66\">Maud\u003c/b>&nbsp;8&nbsp;h, \u003cb style=\"color:#4B4B4B\">Kéké\u003c/b>&nbsp;5&nbsp;h, \u003cb style=\"color:#5B6B2E\">Loïc\u003c/b>&nbsp;2&nbsp;h\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>15\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner full annoncesinner'>\u003ch2>Petites annonces\u003c/h2>\u003cdiv class=\"pa-index\">Donne · Vend\u003c/div>\u003cdiv class=\"annonces\">\u003csection class=\"pa-ad\">\u003ch3 class=\"pa-cat\">Donne\u003c/h3>\u003cp>\u003cb class=\"pa-lead\">Bouteille de rhum,\u003c/b> gagnée lors de l'édition RDR 2026. Jamais ouverte&nbsp;: le vainqueur était trop occupé à ne pas dormir. À retirer au ponton de Pointe-à-Pitre, auprès de Maud Fontenoyade.\u003c/p>\u003c/section>\u003csection class=\"pa-ad\">\u003ch3 class=\"pa-cat\">Vend\u003c/h3>\u003cp>\u003cb class=\"pa-lead\">Licences du pilote automatique,\u003c/b> efficacité prouvée&nbsp;: 1er des copains à la Route du Rhum 2026. Disponibles dès aujourd'hui&nbsp;; le pilote, lui, reste chez son inventeur.\u003c/p>\u003cul class=\"pa-list\">\u003cli>Ne dort jamais, ne boit pas, ne se plaint pas de la météo.\u003c/li>\u003cli>Lit la météo mondiale des quinze prochains jours, relue toutes les six heures (vent GFS au quart de degré).\u003c/li>\u003cli>Trace des centaines de routes en éventail (routage par isochrones) et en garde six.\u003c/li>\u003cli>Conseiller de bord intégré&nbsp;: une intelligence artificielle qui donne son avis, poliment.\u003c/li>\u003cli>Barre comme un humain&nbsp;: il clique dans le jeu, bouton par bouton.\u003c/li>\u003cli>Prévient sur le téléphone du skipper, même à 3 h du matin.\u003c/li>\u003cli>Bouton d'arrêt d'urgence, au cas où il prendrait la grosse tête.\u003c/li>\u003cli>Zéro option payante.\u003c/li>\u003cli>Faible consommation&nbsp;: zéro litre de café.\u003c/li>\u003cli>Vendu sans garantie contre la Contre-Gazette.\u003c/li>\u003c/ul>\u003cp class=\"pa-prix\">Payable en rhum.\u003c/p>\u003c/section>\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>16\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>"],"map":null,"mapPage":-1,"race":{"t0":1793553240.0,"span":848100.0,"tz":3600.0,"bbox":[13.893621647648246,53.24164849146363,-65.07089587414866,0.42790131701607503],"boats":[{"n":"Amerigo","me":true,"c":"#7B1F14","pts":[[0,49.1009,-4.4574],[8820,49.3398,-5.6878],[14520,49.5246,-6.3606],[21900,49.7783,-7.4016],[29100,49.9623,-8.5235],[36300,50.187,-9.6139],[44040,50.4084,-10.6959],[50700,50.7118,-11.5568],[58380,50.3554,-12.4615],[65100,49.9708,-13.3444],[72240,49.5739,-14.2883],[79980,49.1099,-15.2809],[86460,48.8604,-16.1556],[94140,48.5991,-17.2734],[101340,48.2865,-18.2944],[108000,47.9919,-19.2154],[117000,47.8716,-20.2431],[123000,47.5848,-20.8548],[131400,47.1177,-21.6718],[137400,46.8277,-22.1098],[145500,46.3943,-22.6932],[152160,46.041,-23.2081],[162000,45.5175,-23.9494],[168600,45.2508,-24.4542],[175740,45.6211,-24.8204],[181260,45.6702,-25.1513],[189000,45.4274,-25.7181],[194640,45.23,-26.0784],[202500,44.9484,-26.3943],[209100,44.8103,-26.5653],[218100,44.6861,-26.9034],[227100,44.612,-27.293],[233580,44.4212,-27.5349],[237840,44.3007,-27.7198],[245460,44.0865,-28.1138],[254460,43.8325,-28.6565],[259680,43.7045,-29.059],[266760,43.5668,-29.6254],[274320,43.3832,-30.4125],[284160,43.0583,-31.57],[288240,42.9031,-32.086],[296160,42.7441,-32.937],[302460,42.6536,-33.1391],[310260,42.1855,-33.6304],[317100,41.9119,-33.968],[324360,41.3305,-34.5091],[331560,40.8324,-35.1921],[340020,40.2952,-36.0538],[349380,39.763,-37.0614],[356580,39.3467,-37.7821],[363900,38.9404,-38.5704],[36744
