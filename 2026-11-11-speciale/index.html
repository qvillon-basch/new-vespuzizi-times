<script type="application/json" id="nvt-data">{"pages":["\u003cdiv class='inner une'>\u003cdiv class=\"une-top\">\u003cdiv class=\"ear\">Le seul quotidien\u003cbr>lu à la barre\u003c/div>\u003cdiv class=\"thenew\" data-fitw=\"\">The New\u003c/div>\u003cdiv class=\"seal es\">\u003cb>Édition\u003c/b>\u003cspan>spéciale\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"mast\" data-fitw=\"\" style=\"font-size: 5.9rem;\">Vespuzizi Times\u003c/div>\u003chr class=\"rule\">\u003chr class=\"rule2\">\u003cdiv class=\"es-band\">Édition spéciale\u003c/div>\u003cdiv class=\"date\">\u003cspan>mercredi 11 novembre 2026\u003c/span>\u003cspan>Route du Rhum, l'arrivée\u003c/span>\u003c/div>\u003ch2 class=\"headline\">IL L'A REFAIT&nbsp;!\u003c/h2>\u003cfigure class=\"une-fig\">\u003cdiv class=\"frame\" style=\"width: 24.5848rem; margin: 0px auto;\">\u003cimg class=\"zoom\" src=\"img/une.jpg\" width=\"1535\" height=\"1024\" alt=\"Le dessin de l'arrivée\">\u003c/div>\u003cfigcaption>Un magnum dans une main, la coupe dans l'autre&nbsp;: Amerigo n'a pas eu besoin de choisir.\u003c/figcaption>\u003c/figure>\u003cp class=\"lead\">Amerigo a coupé la ligne de Pointe-à-Pitre à 13&nbsp;h&nbsp;48, après 10&nbsp;j&nbsp;0&nbsp;h&nbsp;46&nbsp;min de course. Il conserve son titre, devant tous les copains. Au classement mondial, il finit 1 499e, le meilleur résultat de sa carrière.\u003c/p>\u003cp>Magnum dans une main, coupe dans l'autre, il attend désormais les autres au ponton. Sans se presser&nbsp;: le bar ne ferme pas.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>1\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003ch2>L'interview d'arrivée\u003c/h2>\u003cp class=\"iq keep\">\u003cb>À quoi avez-vous pensé en franchissant la ligne devant Pointe-à-Pitre&nbsp;?\u003c/b>\u003c/p>\u003cp class=\"ans\">Au rhum, d'abord&nbsp;: on ne traverse pas l'Atlantique pour trinquer à l'eau plate. Puis à mes enfants. Et à ma femme, encore en mer&nbsp;: je vais l'attendre sur le ponton, le temps qu'il faudra.\u003c/p>\u003cfigure class=\"fig inline esfig\" style=\"--h: 20.733333333333334rem;\">\u003cimg class=\"zoom\" src=\"img/es-1.jpg\" width=\"1536\" height=\"1024\" alt=\"Illustration de l'arrivée\">\u003c/figure>\u003cp class=\"iq keep\">\u003cb>Cette victoire, vous la dédiez à qui&nbsp;?\u003c/b>\u003c/p>\u003cp class=\"ans\">À Maud Fontenoyade. Elle ne le sait pas encore, elle est toujours au large. Elle le lira en arrivant.\u003c/p>\u003cp class=\"iq keep\">\u003cb>Le moment le plus dur, celui où vous avez douté&nbsp;?\u003c/b>\u003c/p>\u003cp class=\"ans\">Au sud de l'Irlande, quand Isa Autissier-de-Poche est passée en tête des copains. Pour la première fois, mon nom n'était pas en haut du tableau. Je n'ai pas aimé.\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>2\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cfigure class=\"fig inline esfig\" style=\"--h: 20.74716477651768rem;\">\u003cimg class=\"zoom\" src=\"img/es-2.jpg\" width=\"1535\" height=\"1024\" alt=\"Illustration de l'arrivée\">\u003c/figure>\u003cp class=\"iq keep\">\u003cb>Un mot aux copains encore en mer, et un mot à la Contre-Gazette&nbsp;?\u003c/b>\u003c/p>\u003cp class=\"ans\">Prenez votre temps, le bar ne ferme pas. La Contre-Gazette est la bienvenue aussi&nbsp;: c'est ma tournée… d'eau plate.\u003c/p>\u003cfigure class=\"fig inline esfig\" style=\"--h: 27.2rem;\">\u003cimg class=\"zoom\" src=\"img/anim-3.gif\" width=\"480\" height=\"480\" alt=\"Illustration de l'arrivée\">\u003c/figure>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>3\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"iq keep\">\u003cb>Qu'allez-vous faire maintenant&nbsp;? Vous devez être exténué.\u003c/b>\u003c/p>\u003cp class=\"ans\">Exténué&nbsp;? J'enfile mes baskets, je pars faire un footing.\u003c/p>\u003cp class=\"iq keep\">\u003cb>Vous n'êtes vraiment pas fatigué&nbsp;?\u003c/b>\u003c/p>\u003cp class=\"ans\">Même pas. Je vous en dirai plus ce soir.\u003c/p>\u003ch2>Les copains en mer\u003c/h2>\u003cp class=\"copain\">\u003cb>Jean Le Camembert\u003c/b> · à 19&nbsp;milles\u003cbr>\u003ci>Le meilleur des autres. Amerigo lui garde un verre au frais&nbsp;: il a largement le temps de refroidir.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Loïc Peyronladdition\u003c/b> · à 54&nbsp;milles\u003cbr>\u003ci>Comme son nom l'indique, c'est lui qui paiera l'addition. Amerigo a déjà commandé.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Magegland\u003c/b> · à 86&nbsp;milles\u003cbr>\u003ci>La Contre-Gazette tient enfin son scoop&nbsp;: la ligne d'arrivée existe. Amerigo l'a vue en premier.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Christof Cancer du Colon\u003c/b> · à 92&nbsp;milles\u003cbr>\u003ci>Battu en 2022, battu en 2026. On ne pourra pas lui reprocher son manque de régularité.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Maud Fontenoyade\u003c/b> · à 153&nbsp;milles\u003cbr>\u003ci>Elle barre à la main, sans routeur, comme une vraie. Le ponton l'attend, et Amerigo aussi, avec une pancarte.\u003c/i>\u003c/p>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>4\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cp class=\"copain\">\u003cb>Olivier de Kersaucisson\u003c/b> · à 276&nbsp;milles\u003cbr>\u003ci>Vieux loup de mer, il sait qu'on ne brusque pas une traversée. Il en fait la démonstration.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Ananas Tabarly\u003c/b> · à 486&nbsp;milles\u003cbr>\u003ci>Elle arrivera bien mûre. Le punch est prévu.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Isa Autissier-de-Poche\u003c/b> · à 652&nbsp;milles\u003cbr>\u003ci>La seule à avoir vu Amerigo de dos pendant cette course. Elle en parle encore.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Kéké Gabart\u003c/b> · à 669&nbsp;milles\u003cbr>\u003ci>Elle cherche encore la sortie de l'anticyclone. Amerigo lui envoie l'itinéraire par carte postale.\u003c/i>\u003c/p>\u003cp class=\"copain\">\u003cb>Vasco de Gamelle\u003c/b> · à 900&nbsp;milles\u003cbr>\u003ci>Il cherche toujours la route des Indes. Pointe-à-Pitre, c'est à gauche, à l'ouest.\u003c/i>\u003c/p>\u003cdiv class=\"finale es-finale\">\u003cdiv class=\"orn\">✦ ✦ ✦\u003c/div>\u003cdiv class=\"sig\">Amerigo, vainqueur de la Route du Rhum\u003c/div>\u003c/div>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>5\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>","\u003cdiv class='inner '>\u003cfigure class=\"fig inline esfig\" style=\"--h: 29rem;\">\u003cimg class=\"zoom\" src=\"img/anim-fin.gif\" width=\"480\" height=\"480\" alt=\"Illustration de l'arrivée\">\u003c/figure>\u003c/div>\u003cdiv class='folio'>\u003cspan>The New Vespuzizi Times\u003c/span>\u003cb>6\u003c/b>\u003cspan>11 novembre 2026\u003c/span>\u003c/div>"],"map":null,"mapPage":-1,"race":null,"racePage":-1,"son":"assets/son-page.wav","music":"assets/musique.m4a"}</script>
